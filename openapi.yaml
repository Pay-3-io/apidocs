  /card/fetch_transactions:
      post:
        tags:
          - Card Service
        summary: Fetch card transactions
        description: Fetches paginated card transactions for a user.
        operationId: fetchTransactions

        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - userId
                  - page
                  - limit
                properties:
                  userId:
                    type: string
                    format: uuid
                    description: The user who owns the card.
                  page:
                    type: integer
                    minimum: 1
                    example: 1
                    description: Page number for pagination
                  limit:
                    type: integer
                    minimum: 1
                    maximum: 100
                    example: 10
                    description: Number of transactions per page

        responses:
          "200":
            description: Transactions fetched successfully
            content:
              application/json:
                schema:
                  type: object
                  properties:
