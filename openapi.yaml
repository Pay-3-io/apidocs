  /card/fetch_transactions:
      post:
        tags:
          - Card Service
        summary: Fetch transactions
        description: |
          Fetches paginated transactions for a user.
          - Sandbox: Test cards, mock balances
          - Production: Real cards & transactions
        operationId: fetchTransactions
        parameters:
        - in: header
          name: X-Environment
          required: false
          schema:
            type: string
            enum: [sandbox, production]
          description: |
            Optional environment override.
            Defaults to production.

        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - page
                  - limit
                  - userId
                properties:
                  userId:
                    type: string
                    format: uuid
                    example: "04610acd-01da-4d4d-982f-d12de7dac529"
                  page:
                    type: integer
                    minimum: 0
                    example: 1
                    description: Page number for pagination
                  limit:
                    type: integer
                    minimum: 1
                    maximum: 100
                    example: 10
                    description: Number of transactions per page

        responses:
          "200":
            description: Transactions fetched successfully
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    message:
                      type: string
                      example: "Transactions fetched successfully"
                    transactions:
                      type: array
                      items:
                        type: object
                        properties:
                          transactionId:
                            type: string
                            example: "txn_123456"
                          amount:
                            type: number
                            format: float
                            example: 120.75
                          currency:
                            type: string
                            example: "USD"
                          status:
                            type: string
                            example: "COMPLETED"
                          merchantName:
                            type: string
                            example: "Amazon"
                          transactionDate:
                            type: string
                            format: date-time
                            example: "2025-07-20T14:32:11.000Z"
                    code:
                      type: integer
                      example: 0

          "400":
            description: Invalid pagination parameters
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ErrorResponse"

          "401":
            description: Unauthorized
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ErrorResponse"

          "500":
            description: External API or internal server error
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ErrorResponse"
                example:
                  message: Failed to fetch transactions
                  code: 500

  /card/fetch_deposit_address:
    post:
      summary: Fetch crypto deposit address
      description: Returns a deposit address for the given token and network for the user's account.
      tags:
        - Card Service
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, token, network]
              properties:
                userId: { type: string, example: a8b70aa0-5b6f-481d-b9d2-2617b9e4f5b7 }
                token: { type: string, example: USDC }
                network: { type: string, example: BASE }
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Address fetched successfully }
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      address: { type: string, example: "0x6b4AE0...dE5b" }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "500": { description: External API or internal server error, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /card/issuance_events:
    post:
      summary: Fetch card issuance progress events
      description: |
        Returns the provisioning/issuance progress events for the user. Useful to drive a
        loading/status UI right after calling `issue_card`.
      tags:
        - Card Service
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string, example: a8b70aa0-5b6f-481d-b9d2-2617b9e4f5b7 }
                applicationId: { type: string, description: Optional }
                since: { type: string, description: "Optional ISO timestamp; only events after it" }
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Issuance events fetched successfully }
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      events:
                        type: array
                        items:
                          type: object
                          properties:
                            phase: { type: string, example: cardholder_created }

x-webhooks:
  card.issued:
    post:
      summary: Card issued
      description: |
        Delivered to the client's registered `webhook_url` when a card is issued.

        **Headers**
        - `X-Pay3-Signature`: `hex(HMAC_SHA256(webhook_secret, rawBody))` — verify with your shared secret.
        - `X-Pay3-Event`: event type (e.g. `card.issued`).
        - `X-Pay3-Delivery`: delivery ID (use for idempotent handling of retries).

        **Retries**: non-2xx responses are retried with exponential backoff (30s, 60s, 120s … up to 1h).
        Respond `2xx` quickly and dedupe on `X-Pay3-Delivery`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string, description: Delivery ID (matches X-Pay3-Delivery) }
                type: { type: string, example: card.issued }
                created_at: { type: string, format: date-time }
                data: { type: object, description: Event-specific payload (the issued card) }
      responses:
        "200":
          description: Acknowledged (return any 2xx)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Unique key (UUID recommended) to make a mutating request safely retryable.
        The same key replays the first response; a request still in progress returns `409`.
      schema:
        type: string

  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: Invalid request parameters
        code:
          type: integer
          example: 400
