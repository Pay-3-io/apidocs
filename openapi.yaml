    # Referral Codes（紹介コード）

    御社の紹介コード（代理店コード）を登録し、コード付きリンク経由で登録したユーザーを
    そのコードに紐付けます。

    すべて `Authorization: Bearer <accessToken>` が必要です。
    Base URL (sandbox): `https://api-staging.pay-3.io/functions/v1/external-service`

    > **ベース URL は末尾の `/external-service` まで含みます**（仕様書 §2 と同じ定義です）。
    > 以下の見出しのパスはすべてそのベース URL の直下です
    > （例: `GET {BASE_URL}/referral-codes`）。同じ注記が **pool.md** の冒頭にあります。

    ## 必要なスコープ

    | スコープ | 範囲 |
    |---|---|
    | `referrals:read` | 一覧の取得 |
    | `referrals:write` | 登録・有効化切替・削除（`referrals:read` を含む） |

    ## コードの規則

    - 英数字・ハイフン・アンダースコアの 3〜64 文字。
    - **大文字小文字は区別しません**。`PARTNER-A` と `partner-a` は同じコードで、共存できません。
    - **早い者勝ち**。全社横断で一意です（ユーザーの登録導線が 1 つの名前空間のため）。
    - **誤登録は「変更」ではなく「削除して新規作成」**してください。改名 API は提供しません
      （カスケード変更と履歴の取り扱いを避けるための明示的な決定です）。

    ## GET /referral-codes

    自社のコード一覧。

    - 200:
      ```json
      {
        "data": [
          { "code": "PARTNER-A", "enabled": true, "label": "代理店A",
            "link": "https://app.pay-3.io/?ref=PARTNER-A",
            "createdAt": "...", "updatedAt": "..." }
        ]
      }
      ```
    - **クエリ引数は受け付けません。** 常に自社の全コードを新しい順で返します
      （ページングも絞り込みもありません）。`?enabled=true` のような引数を付けると `400` で、
      本文は `Unknown query parameter "enabled". Accepted: (none)` になります。
      効いていない引数を黙って捨てて「絞り込めたように見える全件」を返さないためです
      （詳細は **pool.md の「クエリ引数の検証」**）。

    ## POST /referral-codes

    - body: `{ "code": "PARTNER-A", "label": "代理店A", "enabled": true }`
      - `label` / `enabled` は省略可（`enabled` の既定は `true`）
    - 201: 上記 1 件の形
    - 400: コードの形式が不正
    - 409: 既に使われている（早い者勝ち）

    ## PATCH /referral-codes/{code}

    有効化 / 無効化のみ。

    - body: `{ "enabled": false }`
    - 200: 更新後の 1 件
    - 400: `enabled` 以外を変更しようとした（改名は削除 → 新規作成）
    - 404: 見つからない

    無効化したコードは新規の紐付けに使えなくなります（`POST /users/register` が 400 を返す）。
    **既に紐付いたユーザーの帰属は変わりません。**

    ## DELETE /referral-codes/{code}

    - 200: `{ "code": "PARTNER-A", "deleted": true }`
    - 404: 見つからない

    ユーザーの帰属は登録時点で確定するため、**削除しても過去の帰属・集計は変わりません。**
    削除は元に戻せないので、コンソールから操作する場合は確認のうえ実行してください。

    > コードは完全一致で照合します。`%` や `_` をパスに入れても
    > ワイルドカードとして扱われることはありません（一括削除はできません）。

    ---

    ## ユーザーとの紐付け

    `POST /users/register` に `referral_code` を付けて登録すると、
    そのユーザーがコードに紐付きます。

    ```bash
    curl -X POST "$BASE_URL/users/register" \
      -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
      -d '{
            "signup_type": "EMAIL",
            "signup_type_id": "taro@example.com",
            "first_name": "Taro",
            "referral_code": "PARTNER-A"
          }'
    ```

    - 成功時のレスポンスに `referralCode` が入ります（紐付かなかった場合は `null`）。
    - **`referral_code` に指定できるのは、ご自身の client で発行されたコードだけです。**
      他社が発行したコードは、実在しないコードと**同じ `400`**（同一のレスポンス本文）になります。
    - **コードが未登録 / 無効化済みの場合は `400` を返し、ユーザーを作成しません。**
      黙って無視すると「コードを付けたのに紐付いていない」状態が静かに発生するためです。
    - 紐付けは **1 ユーザー 1 件**で、後から上書きされません。

    ### Web 登録導線（`?ref=` 付きリンク）について

    `GET /referral-codes` が返す `link`（`https://app.pay-3.io/?ref=CODE`）は、
    **Web 登録画面側での `?ref` 取り込みが未実装のため、現時点では紐付きません。**
    2026-09-14 時点で紐付けが動作するのは上記の **API 登録経路のみ**です。
    Web 導線を使う場合は別途 Pay3 側の対応が必要です。

    ---

    # Idempotency

    金銭やプロビジョニングが動く操作（カード発行、KYC submit）は、ネットワーク再送による**二重実行**を防ぐため冪等化されています。

    ## 使い方

    リクエストに `Idempotency-Key` ヘッダを付けます。値は御社が生成する一意な文字列（UUID 推奨）。

    ```bash
    curl -X POST "$BASE_URL/card/issue_card" \
      -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
      -H "Idempotency-Key: 7c1f...-unique" \
      -d '{ "userId": "<uuid>", "type": "virtual" }'
    ```

    ## 挙動

    - 同一 `(client, Idempotency-Key, endpoint)` の初回リクエストのみ実行され、結果が保存されます。
    - 同じキーで再送すると、**最初の結果がそのまま返ります**（再実行されない＝カードが2枚発行されない）。
      **これは保存されたレスポンスの再生であって、最新の状態ではありません。** 例えば
      `POST /pool/transfer` の再送は、その指示が既に `settled` になっていても初回の
      `{"status":"pending"}` を返します。**最新状態は `GET /pool/transfer/{transferId}` で取得**
      してください（「同一キーの再送 = 同一応答」を契約として保つためにこの形にしています）。
    - 同じキーに**異なるボディ**を付けて送ると `409` を返します（別の指示を同じキーで送ってしまった取り違えの検出）。
    - 最初のリクエストがまだ処理中に同じキーが来た場合は `409`（in progress）を返します。少し待って再送してください。
    - 最初のリクエストがサーバーエラーで失敗した場合はキーが解放され、同じキーで再試行できます。

    ## 対象エンドポイント

    - `POST /card/issue_card`
    - `POST /kyc/submit`
    - `POST /pool/transfer`

    ヘッダ未指定でも動作しますが、**上記の操作では必ず付けることを強く推奨**します。

    ---

    # Webhooks

    Pay3 で発生したイベント（カード発行など）を、御社のエンドポイントへ **push 配信**します。ポーリング不要でリアルタイムに状態を同期できます。

    ## 設定

    受信エンドポイントと署名鍵は、**コンソールの「開発者 → Webhook」**で御社自身が登録・表示・再発行できます
    （API キーからは操作できません）。
    - 受信エンドポイント（HTTPS）と任意の説明（例: 本番の受信サーバー）
    - 購読するイベント（下の「イベント種別」から選択。既定は全部。`ping` は購読設定に関係なく届きます）
    - 署名検証用シークレット（登録時に発行。コンソールの鍵アイコンで**いつでも表示**でき、再発行すると旧鍵は即時失効）
    - 購読していないイベントは配信されず、配信ログにも載りません

    ## 配信フォーマット

    `webhook_url` に対し `POST`（JSON）で配信されます。

    ヘッダ:
    - `X-Pay3-Event`: イベント種別（例 `card.issued`）
    - `X-Pay3-Delivery`: 配信ID（再送時も同一）
    - `X-Pay3-Signature`: 署名（後述）

    ボディ:
    ```json
    {
      "id": "<delivery-uuid>",
      "type": "card.issued",
      "created_at": "2026-09-15T01:50:00.000Z",
      "data": { "userId": "<uuid>", "cardId": "<uuid>", "cardType": "virtual", "issuedAt": "2026-09-15T01:50:00.000Z" }
    }
    ```

    `data` の項目は**イベントごとに定義された項目のみ**です（下表）。カード基盤・本人確認基盤の
    生レスポンスを中継することはありません。

    ## 署名検証（必須）

    `X-Pay3-Signature` は **受信した生ボディ**に対する HMAC-SHA256（hex）です。鍵は `webhook_secret`。

    検証例（Node.js）:
    ```js
    import crypto from "node:crypto";

    function verify(rawBody, signature, secret) {
      const expected = crypto.createHmac("sha256", secret).update(rawBody).digest("hex");
      return crypto.timingSafeEqual(Buffer.from(expected), Buffer.from(signature));
    }
    ```

    検証に失敗したリクエストは破棄してください（なりすまし防止）。

    ## リトライ

    - 2xx 応答（200 / 204 など）で配信成功とみなします。
    - **5xx・10 秒のタイムアウト・接続不能**は一時的な失敗として、**指数バックオフ**で**最大 6 回まで自動再送**します。
      再送は Pay3 側のスケジューラが **5 分周期**で実行するため、実際の到着は下表の目安から最大 5 分遅れることがあります。
    - **4xx（400 / 401 / 404 / 409 など）は再送しません**。同じ内容を送り直しても結果は変わらないため、その場で
      `failed` として確定します（408 / 425 / 429 だけは一時的とみなして再送します）。
      受信側で署名検証や送信元の確認に失敗している場合は、設定を直してから API で状態を照会してください。

      | 再送 | 直前の失敗からの待ち時間 |
      |---|---|
      | 1 回目 | 30 秒 |
      | 2 回目 | 60 秒 |
      | 3 回目 | 2 分 |
      | 4 回目 | 4 分 |
      | 5 回目 | 8 分 |
      | 6 回目（最終） | 16 分 |

      待ち時間は 30 秒 × 2^(再送回数 − 1) で、上限は 1 時間です。**6 回の再送とも失敗**した配信は
      そこで打ち切られ（`failed`）、以降は自動再送されません（初回配送を含めた配信試行は最大 7 回です）。
      **取りこぼした分の正本は API 側で**照会してください
      （`GET /pool/ledger`・`GET /pool/transfers`・`GET /users/list`）。
    - 受信側は**冪等に**処理してください（ボディの `id` = `X-Pay3-Delivery` で重複排除）。再送は
      **同じ `id`・同じバイト列**で届きます。`created_at` は再送時刻ではなく**元の状態が変わった時刻**（初回送出時に固定）なので、
      再送で変わりません。

    ## 配信状態（status）の語彙

    Pay3 側は配信ごとに以下の状態を記録しています。お問い合わせの際もこの語でご回答します。

    | 状態 | 意味 |
    |---|---|
    | `pending` | 配信待ち（初回、または再試行の待機中） |
    | `delivered` | 2xx を受け取った（配信成功） |
    | `failed` | **実際に配信を試みて**失敗し、再送の上限（6 回）に達した |
    | `skipped_no_endpoint` | `webhook_url` が未登録だったため、**一度も配信を試みていない** |

    `skipped_no_endpoint` は配信の失敗ではありません。`webhook_url` の登録**前**に発生した
    イベントがこれに当たります。**登録後にまとめて再送されることはありません**（下記の
    イベント種別の注記を参照）。

    ## イベント種別

    | イベント | 送出タイミング | `data` の項目 | 状況 |
    |---|---|---|---|
    | `user.registered` | 貴社経由の新規登録 | `userId, email, name, partnerRefCode, registeredAt` | 提供中 |
    | `user.kyc.updated` | 本人確認のいずれかの段の結果が変わった | `userId, kycStatus, stage, stageStatus, updatedAt` | 提供中 |
    | `card.issued` | バーチャルカード発行 | `userId, cardId, cardType, issuedAt` | 提供中 |
    | `card.activated` | リアルカードのアクティブ化 | `userId, cardId, cardType, activatedAt` | 提供中 |
    | `pool.deposit.credited` | プール入金の反映 | `referenceId, grossAmount, feeAmount, netAmount, available, currency, transactionHash, chain, sourceAddress, creditedAt` | 提供中 |
    | `pool.transfer.completed` | チャージ反映完了 | `transferId, userId, amount, settledAt` | 提供中 |
    | `pool.transfer.failed` | チャージ失敗・残高返還 | `transferId, userId, amount, reason, compensatedAt` | 提供中 |

    - `user.registered` は**ブラウザの `?ref=` サインアップ経路でのみ発火します**。`POST /users/register`
      経由の登録は同期レスポンスで `userId` が返るため、本イベントは発火しません
    - `user.registered` の `partnerRefCode` は、`GET /users/list` が同じユーザーに対して返す
      `referralCode` と**同じ値**です（登録時に確定した貴社の紹介コード）。名前が二形あるのは
      経路ごとの綴りの違いで、突き合わせは値でそのまま行えます
    - `user.kyc.updated` は本人確認の **2 段**（一次本人確認 `identity` / カード発行体の審査 `card_issuer`）の
      どちらかの結果が変わるたびに送られます。`stage` がどの段か、`stageStatus` がその段の新しい状態
      （`approved` / `rejected` / `pending`）、`kycStatus` が**総合**（`approved` = チャージ指示・カード発行が
      通る状態。**users.md** の判定表と同じ）です。
      一次が承認された時点では `stage=identity, stageStatus=approved` でも **`kycStatus` は `pending`** です。
      カードを発行できるようになったことを知りたい場合は **`kycStatus` が `approved` になったイベント**を待ってください
      ```json
      { "userId": "<uuid>", "kycStatus": "pending",  "stage": "identity",    "stageStatus": "approved", "updatedAt": "..." }
      { "userId": "<uuid>", "kycStatus": "approved", "stage": "card_issuer", "stageStatus": "approved", "updatedAt": "..." }
      ```
    - `pool.deposit.credited` はユーザーに紐づかないので `data.userId` はありません。`referenceId` は `<chain>:<transactionHash>`
      （台帳 `GET /pool/ledger` の `deposit` 行の `referenceId` と同じ値）。`available` は反映直後のプール残高です
    - `card.activated` はリアルカードのみ（`cardType` は `physical` 固定）。バーチャルカードは
      発行 = 即利用可能のため `card.issued` のみが送られます
    - **サンドボックスでの `card.activated` の扱い**: リアルカード用 BIN がサンドボックスで未解放の
      ため、`card.activated` はサンドボックスでは**実発火を確認できません**（発火点は物理カードの
      アクティブ化成功時のみで、再アクティブ化では送出しません）。ペイロード形状と発火条件は単体
      テストで固定してありますが、**実配信の確認は本番の BIN 解放後**に行います
    - 配信されるのは **`webhook_url` を登録した以降に発生したイベント**のみです。登録前に発生した
      分は `skipped_no_endpoint` として記録され、**登録後も再送されません**（過去分は
      `GET /pool/ledger`・`GET /users/list` 等の API で照会できます）

    ## 再配信・テスト

    - テスト配信: コンソール「開発者 → Webhook」の「テスト送信」で `ping` イベントを 1 通配信します。到達は同じ画面の配信ログで確認できます。
    - 失敗した配信は Pay3 側が **5 分周期で自動再送**します（上記のリトライ回数まで）。手動での再配信が必要な場合は
      配信ログの `id` を添えて Pay3 にご連絡ください。

    ---


servers:
  - url: https://api-staging.pay-3.io/functions/v1/external-service
    description: "sandbox (Development)"
  - url: https://api.pay-3.io/functions/v1/external-service
    description: "production"

tags:
  - name: Auth
    description: "Access tokens for the data plane"
  - name: Users
    description: "Register and look up your own end users"
  - name: KYC Service
    description: "Identity verification (Sumsub) and card-platform onboarding"
  - name: Card Service
    description: "Quote, issue, and manage cards"
  - name: Pool
    description: "Partner pool: balance, deposit address, top-up instructions, ledger"
  - name: Referral codes
    description: "Referral codes and sign-up links attributed to your client"

security:
  - bearerAuth: []

paths:
  /oauth/access-token:
    post:
      tags:
        - Auth
      summary: Generate OAuth access token
      operationId: createAccessToken
      security: []
      description: |
        Generates an OAuth access token for accessing the external service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clientId:
                  type: string
                  description: Opaque client ID shown in the console (`client_` + 32 hex).
                  example: "client_9f2c1b7e4d0a4c8e9b1f2a3c4d5e6f70"
                clientSecret:
                  type: string
                  description: API key (`pay3_sk_test_…` for sandbox, `pay3_sk_live_…` for production). Shown once at issuance.
                  example: "pay3_sk_test_XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: OAuth access token generated successfully
                  accessToken:
                    type: string
                    example: "eyJjbGllbn********tIiwiY2xpZW50X2FwaV9rZXkiOiJkNm9zS0tRWUczZVdUbkE4Q0djVWprWDlpaUN4bnlldUdibXBOVHR3MF9jIiwidGltZXN0YW1wIjoxNzYyNDQ3NzAwMjE3LCJ1dWlkIjoiODY3ZWY5YjctYjM1NC00OWUwLTgyNTktYzIyYjUxMTkwZDZjIn0=./V9EI/wBvkf3qZ2G*****dWQxBBKVsE4+E="
                  success:
                    type: boolean
                    example: true
        "400":
          description: |
            The request body could not be parsed as JSON
            (`{ "message": "Invalid JSON body", "code": 400 }`), or `clientId` was absent
            (`{ "message": "Client ID or name is required", "code": 400 }`). Input errors are
            never reported as `500`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: |
            The `clientId` / `clientSecret` pair is not accepted
            (`{ "message": "Invalid client credentials", "code": 401 }`).
            **"No such client name" and "wrong client secret" return the byte-identical
            response** — splitting them would turn this endpoint into a client-name
            existence oracle. Which side failed is recorded in Pay3's server-side logs only.
            Note `clientId` is the opaque client ID (`client_` + 32 hex) shown in the console; the display name still works for clients created before 2026-09-18. Passing the internal UUID also
            yields this `401`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/register:
    post:
      tags:
        - Users
      operationId: registerUser
      summary: Register a new user
      description: |
        Registers a new user with basic information such as first name, last name, and signup type.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - first_name
                - signup_type_id
                - signup_type
              properties:
                first_name:
                  type: string
                  example: Pratham1
                last_name:
                  type: string
                  example: ""
                signup_type_id:
                  type: string
                  example: "835519111"
                signup_type:
                  type: string
                  example: TELEGRAM
      responses:
        "200":
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User registered successfully
                  code:
                    type: integer
                    example: 0
                  data:
                    type: object
                    properties:
                      first_name:
                        type: string
                        example: Pratham1
                      last_name:
                        type: string
                        example: ""
                      card_issued:
                        type: boolean
                        example: false
                      userId:
                        type: string
                        example: a8b70aa0-5b6f-481d-b9d2-2617b9e4f5b7
        "400":
          description: |
            Invalid request. Returned for a body that cannot be parsed as JSON
            (`Invalid JSON body`), an unsupported `signup_type`
            (`Unsupported signup_type`), a missing or empty `signup_type_id`
            (`User data missing`), and an unknown or foreign `referral_code`
            (`referral_code is unknown or disabled`). No user is created.
            Input errors are never reported as `500`; a `500` always means a
            Pay3-side fault that is safe to retry unchanged.
            Identity matching is a **byte-for-byte** comparison of
            `signup_type_id` — Pay3 applies no normalisation, so the caller must
            send EMAIL in lower case and PHONE in E.164.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            The `signup_type_id` already belongs to a user outside the calling
            client's tenant. The body carries `message` and `code` only — no
            `userId`, no name, no card status. Re-registering an existing user of
            your own tenant is **not** an error: it returns `200` with the same
            `userId` (see docs/api/junoe-sandbox.md §4).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users:
    get:
      tags:
        - Users
      operationId: getUser
      summary: Get user by ID
      description: |
        Retrieves user information if the ID is provided.
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: The user ID (UUID)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User fetched successfully
                  code:
                    type: integer
                    example: 0
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: a8b70aa0-5b6f-481d-b9d2-2617b9e4f5b7
                      first_name:
                        type: string
                        example: Pratham1
                      last_name:
                        type: string
                        example: ""
                      email:
                        type: string
                        nullable: true
                        example: null
                      phone_number:
                        type: string
                        nullable: true
                        example: null
                      telegram_id:
                        type: string
                        example: "835519111"
                      client_id:
                        type: string
                        example: 1df64a72-72be-4522-a0ed-62a7a608e6d3
                      created_at:
                        type: string
                        format: date-time
                        example: "2025-11-06T11:24:28.575703+00:00"
                      updated_at:
                        type: string
                        nullable: true
                        example: null
                      signup_type_id:
                        type: string
                        example: "835519111"
                      signup_type:
                        type: string
                        example: TELEGRAM
                      card_issued:
                        type: boolean
                        example: false
                      kyc_verified:
                        type: boolean
                        nullable: true
                        example: null
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/list:
    get:
      tags:
        - Users
      operationId: listUsers
      summary: List partner users (spec §10-3)
      description: |
        Lists the users attributed to the calling partner: users that signed up
        through one of the partner's referral codes, plus users created via
        `POST /users/register`. This is the same set that `GET /users/{userId}`
        and `POST /pool/transfer` accept.

        `cardStatus` is a **summary flag** taken from Pay3's own records — the
        endpoint issues no per-user card lookups, so a slow or unavailable card
        platform never blocks the list. Card details (count, type, frozen state)
        come from `GET /users/{userId}`.

        The path is `/users/list` (not `GET /users`): `GET /users?id=` is a
        separate, pre-existing endpoint and is left untouched.

        Ordering is fixed: newest `registeredAt` first, ties broken by `userId`,
        so paging with `offset` neither skips nor repeats rows.

        **Unknown query parameters return `400`.** `limit` and `offset` are the
        only accepted names and they are case-sensitive; a misspelling such as
        `?userid=` is rejected rather than ignored, because a silently dropped
        filter comes back as an unfiltered `200` that looks like a valid result.
        The error body lists the accepted names.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: |
            Decimal integer between 1 and 200. Out-of-range or non-integer values
            return `400` — they are never silently clamped.
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Decimal integer, 0 or greater. Negative or non-integer values return `400`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: |
            Successful operation. An empty `data` array means the partner has no
            users yet — it is not an error.
          content:
            application/json:
              schema:
                type: object
                required: [data, paging]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [userId, registeredAt, referralCode, kycStatus, kyc, cardStatus]
                      additionalProperties: false
                      properties:
                        userId:
                          type: string
                          example: 5c3ff529-0000-4000-8000-000000000000
                        registeredAt:
                          type: string
                          nullable: true
                          description: ISO 8601 (UTC).
                          example: "2026-09-14T10:11:12.000Z"
                        referralCode:
                          type: string
                          nullable: true
                          description: Null for users created via `POST /users/register`.
                          example: JUNOE-A
                        kycStatus:
                          type: string
                          enum: [not_submitted, pending, approved, rejected]
                          description: Overall status. `approved` means a charge / card issuance will go through.
                          example: approved
                        kyc:
                          $ref: "#/components/schemas/KycStages"
                        cardStatus:
                          type: string
                          enum: [issued, not_issued]
                          example: issued
                  paging:
                    type: object
                    required: [limit, offset, total]
                    additionalProperties: false
                    properties:
                      limit:
                        type: integer
                        example: 50
                      offset:
                        type: integer
                        example: 0
                      total:
                        type: integer
                        description: Total number of attributed users, before `limit` is applied.
                        example: 1
        "400":
          description: Invalid `limit` or `offset`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient scope (`users:status` required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{userId}:
    get:
      tags:
        - Users
      operationId: getUserById
      summary: Get partner user status (spec §8)
      description: |
        Returns the KYC completion state and card issuance status of a user that
        belongs to the calling partner.

        Visibility is limited to users attributed to the caller's client
        (attribution is recorded at sign-up through a partner referral code).
        Users that are not attributed to the caller — including users that do not
        exist — return `404`. `403` is never used for this, so the existence of a
        user id is not disclosed.

        No sensitive data (card number, CVV, BIN, billing address, name, email) is
        included.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: Pay3 user id (currently a UUID). Delivered by the `user.registered` webhook.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                required: [userId, kycStatus, kyc, cards]
                additionalProperties: false
                properties:
                  userId:
                    type: string
                    example: a8b70aa0-5b6f-481d-b9d2-2617b9e4f5b7
                  kycStatus:
                    type: string
                    enum: [not_submitted, pending, approved, rejected]
                    description: Overall status. `approved` means a charge / card issuance will go through.
                    example: approved
                  kyc:
                    $ref: "#/components/schemas/KycStages"
                  cards:
                    type: array
                    description: Empty array when the user has no card.
                    items:
                      type: object
                      required: [cardType, status]
                      additionalProperties: false
                      properties:
                        cardType:
                          type: string
                          enum: [virtual, physical]
                          example: virtual
                        status:
                          type: string
                          enum: [active, issued, shipped, activated, frozen]
                          example: active
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
