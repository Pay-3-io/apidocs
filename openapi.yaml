  /pool/balance:
    get:
      tags:
        - Pool
      summary: Read the partner pool balance (spec §4.3)
      operationId: getPoolBalance
      description: |
        Current balance of the calling partner's pool. `available` is what a charge
        instruction can draw on: `balance` minus `pendingTransfers` (amounts already
        reserved by accepted-but-not-yet-settled instructions).

        All amounts are fixed 2-decimal **strings**.

        **This endpoint takes no query parameters.** Any parameter returns `400`
        (`Unknown query parameter "...". Accepted: (none)`) instead of being ignored —
        a dropped `?to=` would otherwise read as "the balance as of that date".
        For a balance at a past point in time use `balanceAfter` in `GET /pool/ledger`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                required: [balance, pendingTransfers, available, currency]
                properties:
                  balance: { type: string, example: "995.00" }
                  pendingTransfers: { type: string, example: "0.00" }
                  available: { type: string, example: "995.00" }
                  currency: { type: string, example: "USD" }
        "400":
          description: A query parameter was supplied (this endpoint accepts none)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No pool account has been opened for this client yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pool/deposit_address:
    get:
      tags:
        - Pool
      summary: Read the pool deposit address (spec §5)
      operationId: getPoolDepositAddress
      description: |
        Address to fund the pool from, plus the deposit fee rate applied on arrival
        (`feeRate`, fixed 4-decimal string).

        **Sandbox**: the address is a placeholder — prefix `0xSANDBOX_` with
        `network: "SANDBOX"`. Nothing sent to it arrives anywhere. `currency` still
        reads `"USDT"`, so a sandbox check must test **`network`**, not `currency`.
        A real address is issued for production only, after Pay3 confirms the
        receiving account.

        Returns `409` when no deposit address has been issued for the pool.

        **This endpoint takes no query parameters.** Any parameter returns `400`
        (`Unknown query parameter "...". Accepted: (none)`) instead of being ignored —
        a dropped `?network=TRON` would otherwise read as "the TRON address", while the
        response is always the single address registered for the pool.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                required: [address, network, currency, feeRate]
                properties:
                  address: { type: string, example: "0xSANDBOX_11481a92916e4babae9cc4afa2814fd6" }
                  network: { type: string, example: "SANDBOX" }
                  currency: { type: string, example: "USDT" }
                  feeRate: { type: string, example: "0.0050" }
        "400":
          description: A query parameter was supplied (this endpoint accepts none)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: No deposit address has been issued for this pool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pool/transfer:
    post:
      tags:
        - Pool
      summary: Instruct a charge from the pool to a user (spec §4.1)
      operationId: createPoolTransfer
      description: |
        Draws `amount` from the partner pool and loads it onto the user's card
        balance. Accepted instructions return `202` with `status: "pending"` and
        settle asynchronously — poll `GET /pool/transfer/{transferId}`.

        **Always send `Idempotency-Key`.** Re-sending the same key replays the
        **first** response verbatim (so an already-settled instruction still
        replays `"pending"`); the same key with a different body returns `409`.

        Rejections carry a `transferId` too — the instruction is recorded with its
        reason and can be read back via `GET /pool/transfer/{transferId}`.
      security:
        - bearerAuth: []
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, amount]
              properties:
                userId:
                  type: string
                  description: >
                    Pay3 user id (uuid). The user must belong to the calling partner —
                    either registered through `POST /users/register` or attributed by a
                    referral code.
                amount: { type: string, example: "10.00" }
                currency: { type: string, enum: [USD], default: USD }
      responses:
        "202":
          description: Instruction accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  transferId: { type: string, example: "pt_9f0c..." }
                  status: { type: string, enum: [pending] }
                  amount: { type: string, example: "10.00" }
        "402":
          description: Insufficient pool balance (recorded as `rejected`; body carries `transferId`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown user for this partner (recorded as `rejected`; body carries `transferId`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Same `Idempotency-Key` replayed with a different body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "412":
          description: User KYC is not approved (recorded as `rejected`; body carries `transferId`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: No settlement mode is configured for this client. Pay3 sets it; partners cannot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pool/transfer/{transferId}:
    get:
      tags:
        - Pool
      summary: Read one charge instruction (spec §4.2)
      operationId: getPoolTransfer
      description: |
        Current state of a single instruction. This — not the idempotent replay of
        `POST /pool/transfer` — is how to observe `pending → settled | failed`.
      security:
        - bearerAuth: []
      parameters:
        - name: transferId
          in: path
          required: true
          schema:
            type: string
          example: "pt_9f0c..."
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  transferId: { type: string }
                  userId: { type: string, nullable: true }
                  amount: { type: string, example: "10.00" }
                  status: { type: string, enum: [pending, settled, failed, rejected] }
                  reason: { type: string, nullable: true }
                  settlementMode:
                    type: string
                    nullable: true
                    enum: [simulate]
                  createdAt: { type: string, format: date-time }
                  settledAt: { type: string, format: date-time, nullable: true }
                  failedAt: { type: string, format: date-time, nullable: true }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown instruction for this partner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pool/transfers:
    get:
      tags:
        - Pool
      summary: List charge instructions (spec §4.2 / §10-2)
      operationId: listPoolTransfers
      description: |
        Lists the calling partner's charge instructions, newest `createdAt` first.

        `from` / `to` filter on **`createdAt` (the time the instruction was
        accepted)**, not `settledAt`. The pool ledger records its `transfer` row
        at acceptance time too, so passing the same `from` / `to` to
        `GET /pool/ledger` selects the matching interval.

        **Unknown query parameters return `400`** and the error body lists the
        accepted names (`status, userId, from, to, limit, offset`). Names are
        case-sensitive.

        **Filter values are validated too.** `userId` must be a uuid and `status`
        must be one of the four values below; anything else returns `400` rather
        than an empty `200` — so a typo is never indistinguishable from "no rows".
        A well-formed uuid that is not attributed to the caller returns `200` with
        `"total": 0`.
      security:
        - bearerAuth: []
      parameters:
        - { $ref: "#/components/parameters/ListLimit" }
        - { $ref: "#/components/parameters/ListOffset" }
        - { $ref: "#/components/parameters/ListFrom" }
        - { $ref: "#/components/parameters/ListTo" }
        - name: status
          in: query
          required: false
          description: |
            Out-of-vocabulary values return `400`
            (`status must be one of: pending, settled, failed, rejected`).
          schema:
            type: string
            enum: [pending, settled, failed, rejected]
        - name: userId
          in: query
          required: false
          description: |
            Non-uuid values return `400`
            (`userId must be a uuid (e.g. "3f8c1e2a-5b47-4d9e-8a10-2c6b7d0e4f51")`).

            Matches both attributed instructions and instructions that were
            **rejected with `unknown_user`** (which carry the requested id rather
            than an attributed Pay3 user). The `userId` shown in this list, in
            `GET /pool/transfer/{transferId}` and in the partner console is
            therefore always a value you can filter by.
          schema:
            type: string
            format: uuid
            example: "3f8c1e2a-5b47-4d9e-8a10-2c6b7d0e4f51"
      responses:
        "200":
          description: Successful operation. An empty `data` array is not an error.
          content:
            application/json:
              schema:
                type: object
                required: [data, paging]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        transferId: { type: string, example: "pt_9f0c..." }
                        userId: { type: string }
                        amount: { type: string, example: "100.00" }
                        status: { type: string, enum: [pending, settled, failed, rejected] }
                        reason: { type: string, nullable: true }
                        settlementMode:
                          type: string
                          nullable: true
                          enum: [simulate]
                        createdAt: { type: string, format: date-time }
                        settledAt: { type: string, format: date-time, nullable: true }
                        failedAt: { type: string, format: date-time, nullable: true }
                  paging: { $ref: "#/components/schemas/Paging" }
        "400":
          description: Invalid or unknown query parameter, or an invalid `userId` / `status` value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pool/ledger:
    get:
      tags:
        - Pool
      summary: List pool balance movements (spec §5)
      operationId: listPoolLedger
      description: |
        Lists every movement of the partner's pool balance, newest `createdAt`
        first. `balanceAfter` is the running balance immediately after the row.

        **Unknown query parameters return `400`** and the error body lists the
        accepted names (`type, from, to, limit, offset`). Names are case-sensitive.

        **Filter values are validated too.** `type` must be one of the six values
        below; anything else returns `400` rather than an empty `200` — so a typo
        is never indistinguishable from "no rows". Note that the partner console
        labels `transfer` rows "チャージ" in Japanese, so `?type=charge` is a
        natural thing to write and is rejected with `400`.
      security:
        - bearerAuth: []
      parameters:
        - { $ref: "#/components/parameters/ListLimit" }
        - { $ref: "#/components/parameters/ListOffset" }
        - { $ref: "#/components/parameters/ListFrom" }
        - { $ref: "#/components/parameters/ListTo" }
        - name: type
          in: query
          required: false
          description: |
            Out-of-vocabulary values return `400`
            (`type must be one of: deposit, fee, transfer, refund, withdrawal, adjustment`).
            One value per request — comma-separated lists are not accepted.
          schema:
            type: string
            enum: [deposit, fee, transfer, refund, withdrawal, adjustment]
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                required: [data, paging]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        type:
                          type: string
                          enum: [deposit, fee, transfer, refund, withdrawal, adjustment]
                        amount: { type: string, example: "-50.00" }
                        balanceAfter: { type: string, example: "9950.00" }
                        referenceId: { type: string, nullable: true }
                        metadata:
                          type: object
                          nullable: true
                          description: |
                            Free-form per-row detail. `fee` rows carry the rate used,
                            as a fixed 4-decimal **string** (`{"rate": "0.0050"}`),
                            matching `feeRate` from `GET /pool/deposit_address`.
                        createdAt: { type: string, format: date-time }
                  paging: { $ref: "#/components/schemas/Paging" }
        "400":
          description: Invalid or unknown query parameter, or an invalid `type` value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /referral-codes:
    get:
      tags:
        - Referral codes
      summary: List the partner's referral codes (spec §7)
      operationId: listReferralCodes
      description: |
        Returns **all** of the partner's referral codes, newest first. There is no
        paging and no filtering.

        **This endpoint accepts no query parameters.** Any parameter returns `400`
        with `Accepted: (none)` — a filter that looks applied but is not would be
        read as "there are only these codes".
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string, example: "PARTNER-A" }
                        enabled: { type: boolean }
                        label: { type: string, nullable: true }
                        link:
                          type: string
                          example: "https://app.pay-3.io/?ref=PARTNER-A"
                        createdAt: { type: string, format: date-time }
                        updatedAt: { type: string, format: date-time }
        "400":
          description: Unknown query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags:
        - Referral codes
      summary: Register a referral code (spec §7)
      operationId: createReferralCode
      description: |
        Codes are matched **case-insensitively** and registered first-come,
        first-served across all partners, so a code already taken returns `409`.

        Format: 3–64 characters of `A-Z a-z 0-9 - _`. Anything else is `400`.

        There is no rename: to correct a code, delete it and create a new one.
        Attribution is fixed at signup time, so deleting a code never rewrites
        the users already attributed through it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: "PARTNER-A" }
                label:
                  type: string
                  nullable: true
                  description: Free-form note for your own use. Not shown to end users.
      responses:
        "201":
          description: Code registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralCode"
        "400":
          description: Invalid code format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Code already taken (by you or another partner)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /referral-codes/{code}:
    patch:
      tags:
        - Referral codes
      summary: Enable or disable a referral code (spec §7)
      operationId: updateReferralCode
      description: |
        `enabled` is the only mutable field. A disabled code stops attributing new
        signups; users already attributed keep their attribution.
      security:
        - bearerAuth: []
      parameters:
        - { $ref: "#/components/parameters/ReferralCodePath" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralCode"
        "404":
          description: No such code for this partner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags:
        - Referral codes
      summary: Delete a referral code (spec §7)
      operationId: deleteReferralCode
      description: |
        Deletes exactly one code, matched case-insensitively. Wildcard characters
        carry no meaning here — `DELETE /referral-codes/%` is a `404`, not a bulk
        delete. Users already attributed through the code keep their attribution.
      security:
        - bearerAuth: []
      parameters:
        - { $ref: "#/components/parameters/ReferralCodePath" }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
                  deleted: { type: boolean, enum: [true] }
        "404":
          description: No such code for this partner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /developer:
    get:
      tags:
        - Developer
      summary: Developer settings summary (your own client)
      operationId: getDeveloperSummary
      description: |
        Everything the partner console's "Developer" menu shows, for the calling client only
        (scope `client:manage`). API keys are **masked**; signing keys are never included.
        `webhook.events` = `null` means the endpoint subscribes to every event.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientName: { type: string, example: "Partner A" }
                  clientId: { type: string, example: "client_0123456789abcdef0123456789abcdef" }
                  apiKeys:
                    type: array
                    items: { $ref: "#/components/schemas/ApiKey" }
                  webhook: { $ref: "#/components/schemas/WebhookSettings" }
                  ipAllowlist:
                    type: array
                    items: { type: string }
                    example: ["203.0.113.10", "198.51.100.0/24"]
                  ipAllowlistRequired:
                    type: boolean
                    description: When `true`, API-key calls are rejected with 403 `ip_not_registered` until at least one IP is registered. Console access is never subject to the allowlist.
                  docsUrl: { type: string, example: "https://developer.pay-3.io/" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /developer/api-keys:
    get:
      tags:
        - Developer
      summary: List API keys (masked)
      operationId: listApiKeys
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ApiKey" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Developer
      summary: Issue a new API key
      operationId: createApiKey
      description: |
        Issues a new key (`pay3_sk_test_…` on sandbox, `pay3_sk_live_…` on production).
        **The plaintext `key` is returned only in this response** — Pay3 does not store it.
        Up to 10 active keys per client (409 beyond that). Keep several keys and switch over at your own pace.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 64, example: "production backend" }
      responses:
        "201":
          description: Key issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiKey"
                  - type: object
                    properties:
                      key:
                        type: string
                        description: Plaintext key. Shown once.
                        example: "pay3_sk_test_XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Too many active keys (limit 10)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /developer/api-keys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Key id from the list. Keys issued before 2026-09-18 are addressed as `legacy`.
        schema: { type: string }
    patch:
      tags:
        - Developer
      summary: Rename an API key
      operationId: renameApiKey
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - Developer
      summary: Revoke an API key (immediate, irreversible)
      operationId: revokeApiKey
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /developer/webhook:
    put:
      tags:
        - Developer
      summary: Register, change, or clear the webhook endpoint
      operationId: setWebhook
      description: |
        `url` must be an absolute `https://` URL (localhost and URLs with credentials are rejected with 400).
        `events` is a subset of `availableEvents` (omit = subscribe to all; an empty array is 400).
        `description` is free text up to 120 characters. `url: null` clears the endpoint together with
        its description and subscription. If no signing key exists yet, one is issued and returned
        **once** in `secretIssued`; otherwise `secretIssued` is `null`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, nullable: true, example: "https://api.example.com/webhooks/pay3" }
                description: { type: string, nullable: true, maxLength: 120, example: "production receiver" }
                events:
                  type: array
                  nullable: true
                  items: { $ref: "#/components/schemas/WebhookEventType" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/WebhookSettings"
                  - type: object
                    properties:
                      secretIssued:
                        type: string
                        nullable: true
                        description: Newly issued signing key. Shown once; `null` when one already existed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /developer/webhook/secret:
    get:
      tags:
        - Developer
      summary: Show the current webhook signing key
      operationId: getWebhookSecret
      description: Returns the key used for `X-Pay3-Signature`. Every call is written to the audit log. 409 if none has been issued yet.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhookSecret: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: No signing key issued yet (register a webhook URL first)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Developer
      summary: Rotate the webhook signing key
      operationId: rotateWebhookSecret
      description: Issues a new signing key. The previous one stops validating immediately.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Rotated
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhookSecret: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /developer/webhook/test:
    post:
      tags:
        - Developer
      summary: Send a `ping` test event to the registered endpoint
      operationId: sendTestWebhookEvent
      description: Enqueues one `ping` delivery. Check arrival in the delivery log. 409 if no endpoint is registered.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Enqueued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  eventType: { type: string, example: ping }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: No webhook endpoint registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /developer/webhook/deliveries:
    get:
      tags:
        - Developer
      summary: Webhook delivery log (newest first)
      operationId: listWebhookDeliveries
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookDelivery" }
                  paging:
                    type: object
                    properties:
                      limit: { type: integer }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /developer/ip-allowlist:
    put:
      tags:
        - Developer
      summary: Set the source-IP allowlist for API-key calls
      operationId: setIpAllowlist
      description: |
        Replaces the whole list (IPv4 / IPv6 / CIDR, up to 20 entries). **Only calls from listed
        addresses are accepted.** While the list is empty and `ipAllowlistRequired` is `true`, API-key
        calls are rejected with 403 `ip_not_registered`; calls from unlisted addresses get 403 `ip_not_allowed`.
        Console access is never subject to the allowlist, so you can always fix the list from the console.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries:
                  type: array
                  maxItems: 20
                  items: { type: string }
                  example: ["203.0.113.10", "198.51.100.0/24"]
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ipAllowlist:
                    type: array
                    items: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <accessToken>`. The scheme word must be `Bearer`
        (compared case-insensitively per RFC 7235, so `bearer` is also accepted).
        Any other scheme word — and a bare token with no scheme word — is rejected with
        `401 { "message": "Unauthorized", "code": 401 }`.
        The token is opaque: do not decode it or depend on its contents.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        Unique key (UUID recommended) to make a mutating request idempotent.
        Re-sending the same key replays the first result instead of executing
        again. Strongly recommended on card/issue_card and kyc/submit.
      schema:
        type: string

    # Shared query contract for the partner list endpoints. Out-of-range values,
    # unparseable dates and unknown parameter *names* are all `400` — never
    # silently clamped, ignored or dropped.
    ListLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      description: Decimal integer between 1 and 200. Out-of-range or non-integer values return `400`.
    ListOffset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      description: >
        Decimal integer, 0 or greater. Negative or non-integer values return `400`.
        An `offset` past the total returns an empty page (`200` with `"data": []`)
        and the unchanged `total`, not an error.
    ListFrom:
      name: from
      in: query
      required: false
      schema:
        type: string
        example: "2026-09-14"
      description: >
        Inclusive lower bound on `createdAt`. ISO 8601 date (`2026-09-14`, read as
        00:00:00 UTC) or datetime (`2026-09-14T00:00:00Z` / `2026-09-14T09:00:00+09:00`).
        **A date-only value is interpreted in UTC.**
        Non-existent dates (`2026-02-30`) return `400`. An empty value means "no filter".
        **Fractional seconds are accepted up to 6 digits (microseconds)**; 7 or more digits
        return `400` rather than being silently rounded to the stored precision.
    ListTo:
      name: to
      in: query
      required: false
      schema:
        type: string
        example: "2026-09-16"
      description: >
        Inclusive upper bound on `createdAt`. Same format and same `400` rules as `from`.
        **A date-only value is interpreted in UTC and covers the whole day**
        (`to=2026-09-15` means up to and including `2026-09-15T23:59:59.999999Z`).
        A single day is therefore `?from=2026-09-15&to=2026-09-15`; there is no need to
        pass the next day. A datetime value is used exactly as given.

    ReferralCodePath:
      name: code
      in: path
      required: true
      description: The referral code. Matched case-insensitively.
      schema:
        type: string
      example: "PARTNER-A"

  responses:
    BadRequest:
      description: Invalid request (the body names the offending field)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Missing scope, or source IP not on the allowlist (`ip_not_registered` / `ip_not_allowed`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found within the calling client
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ApiKey:
      type: object
      properties:
        id: { type: string, example: "9d2f1c9e-2c6e-4d1f-9a41-3c7d9f0b1a22" }
        name: { type: string, example: "production backend" }
        masked: { type: string, example: "pay3_sk_test_…C6mm" }
        status: { type: string, enum: [active, revoked] }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
        legacy:
          type: boolean
          description: "`true` for the pre-2026-09-18 key format (revocable via id `legacy`)."
    WebhookEventType:
      type: string
      enum: [user.registered, user.kyc.updated, card.issued, card.activated, pool.deposit.credited, pool.transfer.completed, pool.transfer.failed]
    WebhookSettings:
      type: object
      properties:
        url: { type: string, nullable: true, example: "https://api.example.com/webhooks/pay3" }
        hasSecret: { type: boolean }
        description: { type: string, nullable: true }
        events:
          type: array
          nullable: true
          description: "`null` = subscribed to every event"
          items: { $ref: "#/components/schemas/WebhookEventType" }
        availableEvents:
          type: array
          items: { $ref: "#/components/schemas/WebhookEventType" }
        registeredAt: { type: string, format: date-time, nullable: true }
    WebhookDelivery:
      type: object
      properties:
        id: { type: string }
        eventType: { type: string, example: card.issued }
        status: { type: string, description: "See webhooks.md for the vocabulary" }
        attempts: { type: integer }
        maxAttempts: { type: integer }
        lastStatusCode: { type: integer, nullable: true }
        lastError: { type: string, nullable: true }
        payload: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        deliveredAt: { type: string, format: date-time, nullable: true }
        nextAttemptAt: { type: string, format: date-time, nullable: true }
    KycStages:
      type: object
      description: |
        Per-stage verification status. `identity` is the first-line identity check;
        `cardIssuer` is the card issuer's own review that follows it. The overall `kycStatus`
        becomes `approved` only when both are approved.
      required: [identity, cardIssuer]
      additionalProperties: false
      properties:
        identity:
          type: object
          required: [status]
          additionalProperties: false
          properties:
            status:
              type: string
              enum: [not_submitted, pending, approved, rejected]
        cardIssuer:
          type: object
          required: [status]
          additionalProperties: false
          properties:
            status:
              type: string
              enum: [not_started, pending, approved, rejected]
    ReferralCode:
      type: object
      required: [code, enabled, link, createdAt, updatedAt]
      properties:
        code: { type: string, example: "PARTNER-A" }
        enabled: { type: boolean }
        label: { type: string, nullable: true }
        link:
          type: string
          description: Signup link that carries the code. Sandbox uses `app2.pay-3.io`.
          example: "https://app2.pay-3.io/?ref=PARTNER-A"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Paging:
      type: object
      required: [limit, offset, total]
      properties:
        limit: { type: integer, example: 50 }
        offset: { type: integer, example: 0 }
        total:
          type: integer
          nullable: true
          description: Total rows matching the filters, before `limit` is applied.
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: Invalid request parameters
        code:
          type: integer
          example: 400
