                cardId:
                  type: string
                  format: uuid
                  example: "cee34fdd-51cc-49bd-b71a-d6bc0653bb34"
      responses:
        "200":
          description: Card details fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Card details fetched successfully"
                  code:
                    type: integer
                    example: 0
