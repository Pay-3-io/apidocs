openapi: 3.0.3
info:
  title: Pay3 External API
  version: "1.2.0"
  description: A system that allows external corporations (Partners) to use Pay3’s card issuance, KYC, and payment infrastructure while maintaining their own UI.

servers:
  - url: https://api-staging.pay-3.io/functions/v1/external-service
    description: "sandbox (Development)"
  - url: https://api.pay-3.io/functions/v1/external-service
    description: "production"

tags:
  - name: Auth
    description: "Access tokens for the data plane"
  - name: Users
    description: "Register and look up your own end users"
  - name: KYC Service
    description: "Identity verification (Sumsub) and card-platform onboarding"
  - name: Card Service
    description: "Quote, issue, and manage cards"
  - name: Pool
    description: "Partner pool: balance, deposit address, top-up instructions, ledger"
  - name: Referral codes
    description: "Referral codes and sign-up links attributed to your client"
  - name: Developer
    description: "Your own credentials, webhook endpoint, and source-IP allowlist (same as the console's Developer menu)"

security:
  - bearerAuth: []

paths:
  /oauth/access-token:
    post:
      tags:
        - Auth
      summary: Generate OAuth access token
      operationId: createAccessToken
      security: []
      description: |
        Generates an OAuth access token for accessing the external service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clientId:
                  type: string
                  description: Opaque client ID shown in the console (`client_` + 32 hex).
                  example: "client_9f2c1b7e4d0a4c8e9b1f2a3c4d5e6f70"
                clientSecret:
                  type: string
                  description: API key (`pay3_sk_test_…` for sandbox, `pay3_sk_live_…` for production). Shown once at issuance.
                  example: "pay3_sk_test_XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: OAuth access token generated successfully
                  accessToken:
                    type: string
                    example: "eyJjbGllbn********tIiwiY2xpZW50X2FwaV9rZXkiOiJkNm9zS0tRWUczZVdUbkE4Q0djVWprWDlpaUN4bnlldUdibXBOVHR3MF9jIiwidGltZXN0YW1wIjoxNzYyNDQ3NzAwMjE3LCJ1dWlkIjoiODY3ZWY5YjctYjM1NC00OWUwLTgyNTktYzIyYjUxMTkwZDZjIn0=./V9EI/wBvkf3qZ2G*****dWQxBBKVsE4+E="
                  success:
                    type: boolean
                    example: true
        "400":
          description: |
            The request body could not be parsed as JSON
            (`{ "message": "Invalid JSON body", "code": 400 }`), or `clientId` was absent
            (`{ "message": "Client ID or name is required", "code": 400 }`). Input errors are
            never reported as `500`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: |
            The `clientId` / `clientSecret` pair is not accepted
            (`{ "message": "Invalid client credentials", "code": 401 }`).
            **"No such client name" and "wrong client secret" return the byte-identical
            response** — splitting them would turn this endpoint into a client-name
            existence oracle. Which side failed is recorded in Pay3's server-side logs only.
            Note `clientId` is the opaque client ID (`client_` + 32 hex) shown in the console; the display name still works for clients created before 2026-09-18. Passing the internal UUID also
            yields this `401`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/register:
    post:
      tags:
        - Users
      operationId: registerUser
      summary: Register a new user
      description: |
        Registers a new user with basic information such as first name, last name, and signup type.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - first_name
                - signup_type_id
                - signup_type
              properties:
                first_name:
                  type: string
                  example: Pratham1
                last_name:
                  type: string
                  example: ""
                signup_type_id:
                  type: string
                  example: "835519111"
                signup_type:
                  type: string
                  example: TELEGRAM
      responses:
        "200":
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User registered successfully
                  code:
                    type: integer
                    example: 0
                  data:
                    type: object
                    properties:
                      first_name:
                        type: string
                        example: Pratham1
                      last_name:
                        type: string
                        example: ""
                      card_issued:
                        type: boolean
                        example: false
                      userId:
                        type: string
                        example: a8b70aa0-5b6f-481d-b9d2-2617b9e4f5b7
        "400":
          description: |
            Invalid request. Returned for a body that cannot be parsed as JSON
            (`Invalid JSON body`), an unsupported `signup_type`
            (`Unsupported signup_type`), a missing or empty `signup_type_id`
            (`User data missing`), and an unknown or foreign `referral_code`
            (`referral_code is unknown or disabled`). No user is created.
            Input errors are never reported as `500`; a `500` always means a
            Pay3-side fault that is safe to retry unchanged.
            Identity matching is a **byte-for-byte** comparison of
            `signup_type_id` — Pay3 applies no normalisation, so the caller must
            send EMAIL in lower case and PHONE in E.164.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            The `signup_type_id` already belongs to a user outside the calling
            client's tenant. The body carries `message` and `code` only — no
            `userId`, no name, no card status. Re-registering an existing user of
            your own tenant is **not** an error: it returns `200` with the same
            `userId` (see docs/api/junoe-sandbox.md §4).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users:
    get:
      tags:
        - Users
      operationId: getUser
      summary: Get user by ID
      description: |
        Retrieves user information if the ID is provided.
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: The user ID (UUID)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User fetched successfully
                  code:
                    type: integer
                    example: 0
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: a8b70aa0-5b6f-481d-b9d2-2617b9e4f5b7
                      first_name:
                        type: string
                        example: Pratham1
                      last_name:
                        type: string
                        example: ""
                      email:
                        type: string
                        nullable: true
                        example: null
                      phone_number:
                        type: string
                        nullable: true
                        example: null
                      telegram_id:
                        type: string
                        example: "835519111"
                      client_id:
                        type: string
                        example: 1df64a72-72be-4522-a0ed-62a7a608e6d3
                      created_at:
                        type: string
                        format: date-time
                        example: "2025-11-06T11:24:28.575703+00:00"
                      updated_at:
                        type: string
                        nullable: true
                        example: null
                      signup_type_id:
                        type: string
                        example: "835519111"
                      signup_type:
                        type: string
                        example: TELEGRAM
                      card_issued:
                        type: boolean
                        example: false
                      kyc_verified:
                        type: boolean
                        nullable: true
                        example: null
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/list:
    get:
      tags:
        - Users
      operationId: listUsers
      summary: List partner users (spec §10-3)
      description: |
        Lists the users attributed to the calling partner: users that signed up
        through one of the partner's referral codes, plus users created via
        `POST /users/register`. This is the same set that `GET /users/{userId}`
        and `POST /pool/transfer` accept.

        `cardStatus` is a **summary flag** taken from Pay3's own records — the
        endpoint issues no per-user card lookups, so a slow or unavailable card
        platform never blocks the list. Card details (count, type, frozen state)
        come from `GET /users/{userId}`.

        The path is `/users/list` (not `GET /users`): `GET /users?id=` is a
        separate, pre-existing endpoint and is left untouched.

        Ordering is fixed: newest `registeredAt` first, ties broken by `userId`,
        so paging with `offset` neither skips nor repeats rows.

        **Unknown query parameters return `400`.** `limit` and `offset` are the
        only accepted names and they are case-sensitive; a misspelling such as
        `?userid=` is rejected rather than ignored, because a silently dropped
        filter comes back as an unfiltered `200` that looks like a valid result.
        The error body lists the accepted names.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: |
            Decimal integer between 1 and 200. Out-of-range or non-integer values
            return `400` — they are never silently clamped.
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Decimal integer, 0 or greater. Negative or non-integer values return `400`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: |
            Successful operation. An empty `data` array means the partner has no
            users yet — it is not an error.
          content:
            application/json:
              schema:
                type: object
                required: [data, paging]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [userId, registeredAt, referralCode, kycStatus, kyc, cardStatus]
                      additionalProperties: false
                      properties:
                        userId:
                          type: string
                          example: 5c3ff529-0000-4000-8000-000000000000
                        registeredAt:
                          type: string
                          nullable: true
                          description: ISO 8601 (UTC).
                          example: "2026-09-14T10:11:12.000Z"
                        referralCode:
                          type: string
                          nullable: true
                          description: Null for users created via `POST /users/register`.
                          example: JUNOE-A
                        kycStatus:
                          type: string
                          enum: [not_submitted, pending, approved, rejected]
                          description: Overall status. `approved` means a charge / card issuance will go through.
                          example: approved
                        kyc:
                          $ref: "#/components/schemas/KycStages"
                        cardStatus:
                          type: string
                          enum: [issued, not_issued]
                          example: issued
                  paging:
                    type: object
                    required: [limit, offset, total]
                    additionalProperties: false
                    properties:
                      limit:
                        type: integer
                        example: 50
                      offset:
                        type: integer
                        example: 0
                      total:
                        type: integer
                        description: Total number of attributed users, before `limit` is applied.
                        example: 1
        "400":
          description: Invalid `limit` or `offset`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient scope (`users:status` required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{userId}:
    get:
      tags:
        - Users
      operationId: getUserById
      summary: Get partner user status (spec §8)
      description: |
        Returns the KYC completion state and card issuance status of a user that
        belongs to the calling partner.

        Visibility is limited to users attributed to the caller's client
        (attribution is recorded at sign-up through a partner referral code).
        Users that are not attributed to the caller — including users that do not
        exist — return `404`. `403` is never used for this, so the existence of a
        user id is not disclosed.

        No sensitive data (card number, CVV, BIN, billing address, name, email) is
        included.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: Pay3 user id (currently a UUID). Delivered by the `user.registered` webhook.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                required: [userId, kycStatus, kyc, cards]
                additionalProperties: false
                properties:
                  userId:
                    type: string
                    example: a8b70aa0-5b6f-481d-b9d2-2617b9e4f5b7
                  kycStatus:
                    type: string
                    enum: [not_submitted, pending, approved, rejected]
                    description: Overall status. `approved` means a charge / card issuance will go through.
                    example: approved
                  kyc:
                    $ref: "#/components/schemas/KycStages"
                  cards:
                    type: array
                    description: Empty array when the user has no card.
                    items:
                      type: object
                      required: [cardType, status]
                      additionalProperties: false
                      properties:
                        cardType:
                          type: string
                          enum: [virtual, physical]
                          example: virtual
                        status:
                          type: string
                          enum: [active, issued, shipped, activated, frozen]
                          example: active
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient scope (`users:status` required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found, or not attributed to the calling client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: |
            Card issuance status could not be retrieved. Distinct from "no cards"
            — retry rather than treating it as an empty list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /kyc/access-token:
    post:
      operationId: createKycAccessToken
      summary: Generate KYC access token
      description: |
        Generates a temporary access token for the user's KYC verification process.
      tags:
        - KYC Service
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
              properties:
                userId:
                  type: string
                  description: The UUID of the user requesting KYC access.
                  example: a8b70aa0-5b6f-481d-b9d2-2617b9e4f5b7
      responses:
        "200":
          description: KYC Access token generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: KYC Access token generated successfully
                  code:
                    type: integer
                    example: 0
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        example: "_act-jwt-eyJhbGciOiJub25lIn0.eyJqdGkiOi=========U5YzAtNDhlYy1iOTM4LWRjZjUyYTk2ZjVjNC12MiIsI=====h0dHBzOi8vYXBpLnN1bXN1Yi5jb20ifQ.-v2"
                      userId:
                        type: string
                        example: a8b70aa0-5b6f-481d-b9d2-2617b9e4f5b7
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /kyc/submit:
    post:
      operationId: submitKyc
      summary: Submit KYC for verification
      description: Submits KYC data for the specified user and applicant ID.
      tags:
        - KYC Service
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - applicantId
              properties:
                userId:
                  type: string
                  example: ac0d2c0d-610e-45c3-9752-520bd0108e45
                applicantId:
                  type: string
                  example: testapplicationId
      responses:
        "200":
          description: KYC submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: KYC submitted successfully
                  code:
                    type: integer
                    example: 0
                  data:
                    type: object
                    properties:
                      applicantId:
                        type: string
                        example: test
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /card/application/start:
    post:
      operationId: startCardApplication
      summary: Start card application
      description: Starts the card application process for a given user and applicant.
      tags:
        - Card Service
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - applicantId
              properties:
                userId:
                  type: string
                  example: ac0d2c0d-610e-45c3-9752-520bd0108e45
                applicantId:
                  type: string
                  example: testapplicationId
      responses:
        "200":
          description: Card application started successfully or already exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Card application started successfully
                  code:
                    type: integer
                    example: 0
                  data:
                    type: object
                    properties:
                      application:
                        type: object
                        properties:
                          id:
                            type: string
                            example: 94655d78-71a8-43a5-9654-7c5996ee51c3
                          created_at:
                            type: string
                            format: date-time
                            example: "2025-11-08T12:55:54.644752+00:00"
                          user_id:
                            type: string
                            example: ac0d2c0d-610e-45c3-9752-520bd0108e45
                          whitelisted:
                            type: boolean
                            example: false
                          code_redeemed:
                            type: string
                            nullable: true
                            example: null
                          phone_verified:
                            type: boolean
                            example: false
                          email_verified:
                            type: boolean
                            example: false
                          kyc_verified:
                            type: boolean
                            example: false
                          personal_data:
                            type: object
                            nullable: true
                            example: null
                          billing_data:
                            type: object
                            nullable: true
                            example: null
                          order_data:
                            type: object
                            nullable: true
                            example: null
                          card_issued:
                            type: boolean
                            example: false
                          card_issued_on:
                            type: string
                            nullable: true
                            example: null
                          card_id:
                            type: string
                            nullable: true
                            example: null
                          kyc_status:
                            type: string
                            nullable: true
                            example: null
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /card/application:
    post:
      operationId: updateCardApplication
      summary: Fetch card application
      description: Retrieves the card application details for a given user.
      tags:
        - Card Service
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
              properties:
                userId:
                  type: string
                  example: ac0d2c0d-610e-45c3-9752-520bd0108e45
      responses:
        "200":
          description: Card application fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Card application fetched
                  code:
                    type: integer
                    example: 0
                  data:
                    type: object
                    properties:
                      application:
                        type: object
                        properties:
                          id:
                            type: string
                            example: 94655d78-71a8-43a5-9654-7c5996ee51c3
                          created_at:
                            type: string
                            format: date-time
                            example: "2025-11-08T12:55:54.644752+00:00"
                          user_id:
                            type: string
                            example: ac0d2c0d-610e-45c3-9752-520bd0108e45
                          whitelisted:
                            type: boolean
                            example: false
                          code_redeemed:
                            type: string
                            nullable: true
                            example: null
                          phone_verified:
                            type: boolean
                            example: false
                          email_verified:
                            type: boolean
                            example: false
                          kyc_verified:
                            type: boolean
                            example: false
                          personal_data:
                            type: object
                            nullable: true
                            example: null
                          billing_data:
                            type: object
                            nullable: true
                            example: null
                          order_data:
                            type: object
                            nullable: true
                            example: null
                          card_issued:
                            type: boolean
                            example: false
                          card_issued_on:
                            type: string
                            nullable: true
                            example: null
                          card_id:
                            type: string
                            nullable: true
                            example: null
                          kyc_status:
                            type: string
                            nullable: true
                            example: null
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /card/quote:
    post:
      operationId: quoteCard
      summary: Quote card issuance price
      description: >
        Returns the price that will be charged when the card is issued. Purely informational —
        no funds move. `type` (form factor) defaults to `physical`, so it must be supplied
        explicitly to quote a virtual card. Unsupported bin / form factor combinations are
        rejected with 400 (the catalog is the source of truth and is fail-closed).
      tags:
        - Card Service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
                  format: uuid
                  example: "04610acd-01da-4d4d-982f-d12de7dac529"
                type:
                  type: string
                  description: Form factor to quote. Defaults to `physical` when omitted.
                  enum:
                    - virtual
                    - physical
                  example: virtual
                bin:
                  type: string
                  description: >
                    Card BIN to quote. Must exist in the Pay3 card BIN catalog and support the
                    requested form factor. Sandbox values — `537100` (Mastercard, virtual),
                    `45492418` (Visa Pay3 Card, virtual), `49387519` (Visa White Card, physical).
                    Omitted: the first BIN that supports the requested form factor.
                  example: "45492418"
                country:
                  type: string
                  description: Destination country. Physical cards only; returns the shipping estimate above baseline.
                  example: JP
      responses:
        "200":
          description: Quote generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Quote generated"
                  code:
                    type: integer
                    example: 0
                  data:
                    type: object
                    properties:
                      bin: { type: string, example: "45492418" }
                      form_factor: { type: string, example: virtual }
                      country: { type: string, nullable: true }
                      currency: { type: string, example: USD }
                      price:
                        type: string
                        description: Customer-facing price (USD, fixed 2 decimals).
                        pattern: '^\d+\.\d{2}$'
                        example: "5.00"
                      estimated_shipping:
                        type: string
                        nullable: true
                        description: >
                          Shipping estimate above the baseline, same fixed 2 decimal format.
                          `null` when it does not apply (virtual cards, or `country` omitted) —
                          `null` means "not applicable", not "free".
                        pattern: '^\d+\.\d{2}$'
                        example: null
                      total:
                        type: string
                        description: Amount actually charged at issuance (USD, fixed 2 decimals).
                        pattern: '^\d+\.\d{2}$'
                        example: "5.00"
              example:
                message: "Quote generated"
                data:
                  bin: "45492418"
                  form_factor: virtual
                  country: null
                  currency: USD
                  price: "5.00"
                  estimated_shipping: null
                  total: "5.00"
                code: 0
        "400":
          description: Unsupported card bin / form factor combination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /card/issue_card:
    post:
      operationId: issueCard
      summary: Issue new card
      description: Issues a new virtual card for a given user.
      tags:
        - Card Service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  format: uuid
                  example: "04610acd-01da-4d4d-982f-d12de7dac529"
                type:
                  type: string
                  description: Type of card to issue
                  enum:
                    - virtual
                    - physical
                  example: virtual
                amount:
                  type: number
                  description: >
                    Optional top-up loaded onto the user balance at issuance (default 0).
                    This is NOT the issuance price — pricing is managed by Pay3.
                  example: 0
                bin:
                  type: string
                  description: >
                    Optional card BIN to issue. Must exist in the Pay3 card BIN catalog and
                    support the requested form factor. Sandbox values — `537100` (Mastercard,
                    virtual), `45492418` (Visa Pay3 Card, virtual), `49387519` (Visa White Card,
                    physical). Omitted: the first BIN that supports the requested form factor
                    (`537100` for virtual in sandbox). Unknown / disabled / form-factor-mismatched
                    BINs are rejected with 400; BINs not permitted for the account with 403.
                  example: "45492418"
      responses:
        "200":
          description: Card issued successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Card issued successfully"
                  code:
                    type: integer
                    example: 0
                  data:
                    type: object
                    description: >
                      Whitelisted card summary. These four fields are the entire response —
                      the card platform's raw payload is never passed through (no PAN, CVV,
                      expiry, billing address, email, or internal identifiers).
                    additionalProperties: false
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Card ID. Same value as `cardId` in the `card.issued` webhook.
                        example: "cee34fdd-51cc-49bd-b71a-d6bc0653bb34"
                      cardType:
                        type: string
                        enum: [virtual, physical]
                        example: virtual
                      status:
                        type: string
                        enum: [active, issued, shipped, activated, frozen]
                        example: active
                      last4:
                        type: string
                        description: Last four digits of the card number.
                        example: "9924"
                example:
                  message: "Card issued successfully"
                  code: 0
                  data:
                    id: "cee34fdd-51cc-49bd-b71a-d6bc0653bb34"
                    cardType: virtual
                    status: active
                    last4: "9924"

        "400":
          description: >
            Invalid request — an unknown / disabled / form-factor-mismatched `bin`, **or the user
            balance is below the issuance price (pre-flight rejection)**. In the balance case the
            request is refused *before* issuance starts, so **no card is created**. Top up and
            retry with a new `Idempotency-Key`. Do not hard-code the required amount: branch on
            `status` / `code` (the price and the card platform's internal fees are Pay3-side
            configuration and differ between sandbox and production).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "Not enough balance to issue card"
                code: 400
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: >
            The balance ran out **mid-issuance** — the card had already been created at the card
            platform and the price could not be collected. Pay3 closes (voids) the card it had just
            created, so a failed attempt never leaves a card behind and `card_issued` stays false.
            This is a **different case from 400**: 400 means the request was refused before any card
            existed. Top up and retry with a new `Idempotency-Key`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "Not enough balance to issue card. The issuance was rolled back and no card was created."
                code: 402
        "403":
          description: >
            Issuance refused. **Two distinct cases — distinguish them by `message`**:

            1. `This card is not available for your account` — the requested `bin` is not
               permitted for this account. Retry with a permitted BIN.
            2. `Card limit reached for your account` / `Card limit reached for this card type`
               — the **card count limit** has been reached. The default is 1 virtual and
               1 physical card per user, but this is a Pay3-side safety limit and a
               **default value that may change** (it can also be configured per client).
               Do **not** hard-code the count: branch on `message`. Changing the `bin`
               does not clear this error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                binNotPermitted:
                  summary: BIN not permitted for this account
                  value:
                    message: "This card is not available for your account"
                    code: 403
                cardLimitReached:
                  summary: Card count limit reached
                  value:
                    message: "Card limit reached for this card type"
                    code: 403
        "409":
          description: >
            Issuance finished without producing a card. In almost all cases the account/card-platform
            setup has not finished yet — `kyc/submit` only **starts** that setup asynchronously, so
            calling issuance before it completes lands in this window. **No card is created and no
            `card.issued` webhook is sent.** Confirm setup has completed (`GET /users/{userId}` →
            `kycStatus` / `cards`, or the `user.kyc.updated` webhook) and retry with a new
            `Idempotency-Key`. Contact Pay3 if it keeps returning 409.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "Card issuance did not complete: no card was created. The account is not ready to be issued a card yet — retry with a new Idempotency-Key once the account setup has finished."
                code: 409

  /card/fetch_cards:
    post:
      operationId: fetchCards
      summary: Fetch all cards for a user
      description: Returns a list of virtual cards associated with the given user.
      tags:
        - Card Service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  format: uuid
                  example: "04610acd-01da-4d4d-982f-d12de7dac529"
      responses:
        "200":
          description: Cards fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Cards info fetched successfully"
                  code:
                    type: integer
                    example: 0
                  data:
                    type: array
                    description: >
                      Whitelisted card summaries. These six fields are the entire response —
                      the card platform's raw payload, internal identifiers (account/budget/
                      cardholder/balance ids), billing address, email, and pricing/feature
                      flags are never passed through.
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        id:
                          type: string
                          format: uuid
                          example: "cee34fdd-51cc-49bd-b71a-d6bc0653bb34"
                        cardType:
                          type: string
                          enum: [virtual, physical]
                          example: virtual
                        status:
                          type: string
                          enum: [active, issued, shipped, activated, frozen]
                          example: active
                        last4:
                          type: string
                          description: Last four digits of the card number.
                          example: "9924"
                        currency:
                          type: string
                          nullable: true
                          example: "USD"
                        balance:
                          type: string
                          nullable: true
                          description: >
                            Card balance as a fixed 2-decimal string (same notation as every
                            other money field). `null` when unavailable — it is never rounded
                            to "0.00", so a zero balance stays distinguishable from a missing one.
                          example: "2.60"
                example:
                  message: "Cards fetched successfully"
                  code: 0
                  data:
                    - id: "cee34fdd-51cc-49bd-b71a-d6bc0653bb34"
                      cardType: virtual
                      status: active
                      last4: "9924"
                      currency: "USD"
                      balance: "2.60"

        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /card/fetch_card_details:
    post:
      operationId: fetchCardDetails
      summary: Fetch card details
      description: >-
        Card number, CVV and expiry are never returned across the partner boundary.
        This endpoint requires a two-factor step-up credential (PCI); tokens issued through the
        partner OAuth flow do not carry one, so partner integrations receive `401` here.
        For card type, status and the last four digits use `POST /card/fetch_cards`
        or `GET /users/{userId}`.
      tags:
        - Card Service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
