                  description: The user who owns the card.
                pin:
                  type: string
                  description: 6-digit ATM PIN
                  example: "123456"
                  minLength: 6
                  maxLength: 6
                cardId:
                  type: string
                  format: uuid
                  example: "cee34fdd-51cc-49bd-b71a-d6bc0653bb34"
      responses:
        "200":
          description: Card PIN set successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Card pin set successfully"
                  code:
                    type: integer
                    example: 0

        "400":
          description: Invalid parameters or unsupported token-network combination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: External API or internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: Failed to set card pin
                code: 500

  /card/lock_card:
