                userId:
                  type: string
                  format: uuid
                  example: "04610acd-01da-4d4d-982f-d12de7dac529"
                cardId:
                  type: string
                  format: uuid
                  example: "cee34fdd-51cc-49bd-b71a-d6bc0653bb34"
      responses:
        "200":
          description: Card details fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Card details fetched successfully"
                  code:
                    type: integer
                    example: 0
                  data:
                    type: object
                    description: >-
                      Always empty. No card detail field is promised on the partner boundary.
                    additionalProperties: false
                    example: {}

        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

