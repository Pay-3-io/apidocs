    # Partner Pool

    Fund a pool balance up front, then instruct charges from that pool onto the card balances of your own users.

    All requests require `Authorization: Bearer <accessToken>`.

    | Environment | Base URL |
    |---|---|
    | Sandbox | `https://api-staging.pay-3.io/functions/v1/external-service` |
    | Production | `https://api.pay-3.io/functions/v1/external-service` |

    The base URL includes the trailing `/external-service`, and every path sits directly under it (`GET {BASE_URL}/pool/balance`). The expanded URL must contain `/external-service` exactly once.

    ## Scopes

    | Scope | Grants |
    |---|---|
    | `pool:read` | Read balance, ledger, and instructions |
    | `pool:transfer` | Create charge instructions (includes `pool:read`) |

    A missing scope returns `403 Insufficient scope: <scope> required`.

    ## Source IP allowlist

    Calls made with a token obtained from an API key are accepted only from IP addresses registered under **Developer → Source IPs** in the console. The rule is identical in sandbox and production.

    - While no IP is registered, every endpoint returns `403 ip_not_registered`. Console access is unaffected, so you can register addresses at any time.
    - A call from an unregistered IP returns `403 ip_not_allowed`.
    - The source is taken from the connecting IP. Forwarded headers such as `x-forwarded-for` and `x-real-ip` are ignored, because a client can set them freely.
    - IPv4, IPv6, and CIDR entries are accepted, up to 20 entries.

    ## Money flow

    ```
    You send the deposit asset to the pool deposit address
      → Pay3 confirms the credit, deducts 0.5%, and adds the remainder to the pool balance in USD
      → You call POST /pool/transfer to charge $X to a given user
      → The amount is drawn from the pool balance and applied to the user's card balance
    ```

    The deduction rate is returned as `feeRate` by `GET /pool/deposit_address` (0.5% by default). Upper and lower amount limits are your responsibility: the instructed amount is charged in USD as given.

    ## GET /pool/balance

    Current pool balance, for refill decisions.

    ```json
    {
      "balance": "9950.00",
      "pendingTransfers": "300.00",
      "available": "9650.00",
      "currency": "USD"
    }
    ```

    | Field | Meaning |
    |---|---|
    | `available` | Amount a charge instruction can draw on right now |
    | `pendingTransfers` | Amounts reserved by accepted instructions that have not settled |
    | `balance` | The sum of the two |

    `?currency=USD` is optional; a pool holds a single currency today, so the response is identical either way, but sending it keeps your code unchanged if pools become multi-currency. A value that is not a three-letter currency code returns `400`; a currency other than the pool's returns `404`, the same response as "no pool".

    - `404` — no pool account has been opened yet.
    - `400` — any other query parameter. This endpoint takes none and always returns the current balance. For a balance at a past point in time, follow `balanceAfter` in `GET /pool/ledger`.

    ## GET /pool/deposit_address

    The pool deposit address. `currency` says what to send, `network` says which chain; both are per-account settings.

    ```json
    { "address": "T...", "network": "TRON", "currency": "USDT", "feeRate": "0.0050" }
    ```

    | Environment | Deposit rail |
    |---|---|
    | Sandbox | USDC on Ethereum Sepolia (`network: "ETH_SEPOLIA"`, named explicitly so it is not confused with mainnet `ETH`) |
    | Production | USDT on TRON |

    - Use the returned `currency` and `network` pair as given. Any other asset sent to the address does not arrive; it can be neither detected nor refunded.
    - Sandbox exercises the whole path — address, credit, ledger row, webhook — but it is a different rail from production. Testnet USDC is available from public faucets.
    - If `network` is `SANDBOX` and `address` starts with `0xSANDBOX_`, no real address has been issued yet. Do not send funds to it.
    - `409` — no deposit address has been issued. Do not send funds.
    - `400` — any query parameter. This endpoint takes none and always returns the single registered address, so `?network=TRON` is rejected rather than dropped.

    ## POST /pool/transfer

    Creates a charge instruction. The `Idempotency-Key` header is required.

    - Headers: `Idempotency-Key: <unique>`
    - Body: `{ "userId": "<uuid>", "amount": "300.00" }`, where `amount` is a string with at most two decimals
    - `202`: `{ "transferId": "pt_...", "status": "pending" }`

    Completion is not returned synchronously. Observe it through the `pool.transfer.completed` / `pool.transfer.failed` webhooks (**Webhooks**) or `GET /pool/transfer/{transferId}`.

    Re-sending the same `Idempotency-Key` creates only one instruction. The same key with a different amount or user returns `409`, so the result of a `$300` instruction is never returned for a `$3000` request. See **Idempotency**.

    ### Eligible users

    You can charge only users that belong to you, which means either:

    1. A user who signed up through one of your referral links (**Referral codes**). Attribution is fixed at sign-up and never changes, even if the code is later disabled or deleted.
    2. A user you created with `POST /users/register`.

    This is exactly the set readable through `GET /users/{userId}` (**Users**). Any other `userId` — another partner's user, an unattributed user, or an id that does not exist — returns `404` without distinction.

    ### Errors

    | Status | Meaning |
    |---|---|
    | 400 | `Idempotency-Key` missing, `userId` missing, or `amount` malformed |
    | 402 | Insufficient pool balance |
    | 404 | User not found (another partner's user returns `404` even if it exists) |
    | 409 | Same key sent with a different body, or a request with that key is still in flight |
    | 412 | The user's KYC is not approved |
    | 429 | Rate limit exceeded |
    | 503 | No settlement mode is configured (see **Settlement modes**) |

    Rejections (402 / 404 / 412, and 409 `pool_not_found`) are recorded with a reason and appear in `GET /pool/transfers` and in the console. Rejection bodies also carry a `transferId` — the id of the recorded rejection row — so your instruction ids map one-to-one to Pay3 ids and the reason can be read back directly.

    ```json
    // 412 (KYC not approved)
    { "message": "User KYC is not approved", "code": 412, "transferId": "pt_9f0c..." }
    // 402 (insufficient balance)
    { "message": "Insufficient pool balance", "code": 402, "transferId": "pt_1a7d..." }
    ```

    In the rare case where recording itself fails, no `transferId` is returned, so you never receive an id you cannot read back.

    ## GET /pool/transfer/{transferId}

    State of a single instruction.

    ```json
    {
      "transferId": "pt_...",
      "userId": "<uuid>",
      "amount": "300.00",
      "currency": "USD",
      "status": "settled",
      "reason": null,
      "settlementMode": "simulate",
      "createdAt": "...",
      "settledAt": "...",
      "failedAt": null
    }
    ```

    - `status` — `pending` | `settled` | `failed` | `rejected`
    - `settlementMode` — `simulate` in sandbox; see **Settlement modes**.
    - `404` — not found (another partner's instruction returns `404` even if it exists).

    ## GET /pool/transfers

    List of instructions, newest `createdAt` first.

    - Query: `status`, `userId`, `from`, `to`, `limit`, `offset` — see **Query parameters**
    - `200`: `{ "data": [ ...same shape as GET /pool/transfer... ], "paging": { limit, offset, total } }`

    `userId` accepts only a uuid, the same value as `userId` in `GET /users/list`. A well-formed uuid that is not attributed to you returns `200` with `"total": 0`.

    ```bash
    $ curl -s "$BASE_URL/pool/transfers?userId=abc" -H "Authorization: Bearer $TOKEN"
    {"message":"userId must be a uuid (e.g. \"3f8c1e2a-5b47-4d9e-8a10-2c6b7d0e4f51\")","code":400}
    ```

    An instruction naming a user you do not own is rejected with `unknown_user`, but the rejection is still recorded, and both the list and the detail response return the `userId` you sent, unchanged. `?userId=` filters those rejected rows too, so any `userId` shown in the list, in the detail response, or in the console can be passed straight back as a filter.

    `from` / `to` filter on `createdAt`, the time the instruction was accepted, not on `settledAt`. The ledger records its `transfer` row at acceptance time as well, so the same `from` / `to` select the matching interval in both endpoints.

    ```bash
    # a single day (2026-09-15T00:00:00Z – 23:59:59.999999Z)
    curl -s "$BASE_URL/pool/transfers?from=2026-09-15&to=2026-09-15&limit=50" \
      -H "Authorization: Bearer $TOKEN"
    ```

    ## GET /pool/ledger

    Every movement of the pool balance, newest `createdAt` first.

    - Query: `type`, `from`, `to`, `limit`, `offset` — see **Query parameters**

    ```json
    {
      "data": [
        { "id": "...", "type": "fee", "amount": "-50.00", "balanceAfter": "9950.00",
          "referenceId": "tx-...", "metadata": { "rate": "0.0050" }, "createdAt": "..." },
        { "id": "...", "type": "deposit", "amount": "10000.00", "balanceAfter": "10000.00",
          "referenceId": "tx-...", "metadata": null, "createdAt": "..." }
      ],
      "paging": { "limit": 50, "offset": 0, "total": 5 }
    }
    ```

    `balanceAfter` is the running balance immediately after the row is applied. A credit is split into two rows — gross in, then fee out — so in the example above, a credit of 10,000.00 into an empty pool gives `10000.00` on the `deposit` row and `9950.00` on the newer `fee` row. Adding `amount` from the oldest row forward reproduces each `balanceAfter`.

    | `type` | Sign | Meaning |
    |---|---|---|
    | `deposit` | + | A credit applied to the pool (gross, before deduction) |
    | `fee` | − | The deduction taken on credit (0.5% by default) |
    | `transfer` | − | A charge drawn for a user (written at acceptance) |
    | `refund` | + | Return of a failed charge (offsets the `transfer` row with the same `referenceId`) |
    | `withdrawal` | − | Pool balance withdrawn back out of USD |
    | `adjustment` | ± | Operational adjustment |

    Every operation that moves the pool balance writes exactly one row; operations that do not move it write none. For charge instructions:

    | Event | Ledger |
    |---|---|
    | Instruction accepted (202) | A `transfer` row (−) is written at that moment; the balance drops here |
    | Instruction becomes `settled` | No new row. `settlement_mode` is added to the `transfer` row's `metadata` |
    | Instruction becomes `failed` | A `refund` row (+) offsets the `transfer` row by the same amount |
    | Instruction rejected (402 / 404 / 412) | No row, because the balance did not move. The rejection is in `GET /pool/transfers` |

    `pending` instructions therefore appear in the ledger, and the balance never drops without a corresponding row. A row's `referenceId` is the `transferId`, so `GET /pool/transfer/{transferId}` gives that row's final state.

    `metadata` is free-form per-row detail. `fee` rows carry the rate used as `{"rate": "0.0050"}` — a fixed 4-decimal string, like `feeRate` from `GET /pool/deposit_address`, never a number.

    `?type=` accepts exactly one of the six values above; uppercase values and comma-separated lists are not. The console labels a charge drawn for a user differently from the API value, which is `transfer`:

    ```bash
    $ curl -s "$BASE_URL/pool/ledger?type=charge" -H "Authorization: Bearer $TOKEN"
    {"message":"type must be one of: deposit, fee, transfer, refund, withdrawal, adjustment","code":400}
    ```

    ## Query parameters

    On the list endpoints (`GET /pool/transfers`, `GET /pool/ledger`, `GET /users/list`, `GET /referral-codes`) and on `GET /pool/balance`, values and parameter names are validated strictly: out-of-range values, malformed values, and unknown names all return `400` with a body of the form `{ "message": ..., "code": 400 }`, rather than being clamped, ignored, or answered with an empty `200`. A typo is therefore never indistinguishable from "no rows".

    | Parameter | Accepted values | Default |
    |---|---|---|
    | `limit` | Decimal integer 1–200 (`1e2`, `1.5`, `abc`, `-1`, `0`, `201` return 400) | 50 |
    | `offset` | Decimal integer 0 or more. An `offset` past the total returns an empty `200` page: `"data": []`, with `"total"` still the filtered total | 0 |
    | `from` / `to` | ISO 8601 date `2026-09-14`, or datetime with offset `2026-09-14T00:00:00Z` / `2026-09-14T09:00:00+09:00`. Non-existent dates (`2026-02-30`) return 400. Fractional seconds up to 6 digits, matching the stored precision; 7 or more return 400 | no filter |
    | `type` (`/pool/ledger`) | Exactly one of `deposit`, `fee`, `transfer`, `refund`, `withdrawal`, `adjustment` | no filter |
    | `status` (`/pool/transfers`) | Exactly one of `pending`, `settled`, `failed`, `rejected` | no filter |
    | `userId` (`/pool/transfers`) | A uuid | no filter |

    An empty value (`?from=`) means "no filter".

    Names are case-sensitive (`userid` is not `userId`), and an unaccepted name returns the list of names that endpoint accepts.

    ```bash
    $ curl -s "$BASE_URL/pool/ledger?userid=abc" -H "Authorization: Bearer $TOKEN"
    {"message":"Unknown query parameter \"userid\". Accepted: type, from, to, limit, offset","code":400}
    ```

    | Endpoint | Accepted parameters |
    |---|---|
    | `GET /pool/ledger` | `type`, `from`, `to`, `limit`, `offset` |
    | `GET /pool/transfers` | `status`, `userId`, `from`, `to`, `limit`, `offset` |
    | `GET /users/list` | `limit`, `offset` |
    | `GET /referral-codes` | (none; always returns all codes) |
    | `GET /pool/balance` | (none; always returns the current balance) |
    | `GET /pool/deposit_address` | (none; always returns the registered address) |

    ### Date boundaries

    A date-only value is interpreted in UTC.

    | Value | Boundary |
    |---|---|
    | `from=2026-09-15` (date only) | From `2026-09-15T00:00:00Z` |
    | `to=2026-09-15` (date only) | Up to `2026-09-15T23:59:59.999999Z` — the whole day is included |
    | `from` / `to` with a datetime | The given instant, inclusive at both ends |

    A single day is `?from=2026-09-15&to=2026-09-15`; there is no need to pass the next day. To cut a day in a local time zone, pass datetimes with the offset, for example `?from=2026-09-15T00:00:00+09:00&to=2026-09-15T23:59:59+09:00`.

    ## Unknown paths and error bodies

    - Unrecognised paths and unsupported HTTP methods return a JSON `404`: `{ "message": "Unknown endpoint. ...", "code": 404 }`. A misspelling such as `POST /pool/tranfer` never returns success. The `/kyc/*` and `/card/*` subtrees resolve `userId` before routing, so their responses to unknown paths depend on the body (**Endpoints**).
    - A request can be answered at the edge before it reaches the application, in which case the error body is not JSON. Check `content-type` in your error handling and make sure your parser tolerates a non-JSON body.

    ## Settlement modes

    The settlement mode is set per client by Pay3 and cannot be changed through the partner API. `simulate` is the sandbox mode; production values are provided during production onboarding.

    - Under `simulate`, funds move from the pool balance to the user's card balance along the same path as in production, so a `settled` instruction really is reflected on the card balance. What the sandbox omits is only the detection of incoming deposits on the production rail; sandbox credits are detected on the sandbox rail and emit `pool.deposit.credited` (**Webhooks**).
    - If funds cannot be moved — insufficient pool funds, or an error on the card platform — the instruction is recorded as `failed` with a reason and the amount is returned to the pool balance.
    - A client with no mode configured gets `503` from `POST /pool/transfer`. There is no default, so a missing setting can never produce a ledger row without a matching movement.
    - Finalised rows carry `settlementMode`, and the mode is kept in the ledger `metadata`, so sandbox rows never look like production movements.

    ## Notes

    - `userId` accepts Pay3 uuids only.
    - A credit that cannot be matched to a pool is recorded as pending and handled by Pay3; it is never discarded silently.
    - Withdrawals from the pool balance are handled on request; contact Pay3.

    The machine-readable reference for every endpoint and field is `openapi.yaml`.

    ---

    # Referral Codes

    Register the referral codes your client uses, and attribute the users who sign up through them.

    All requests require `Authorization: Bearer <accessToken>`.

    | Environment | Base URL |
    |---|---|
    | Sandbox | `https://api-staging.pay-3.io/functions/v1/external-service` |
    | Production | `https://api.pay-3.io/functions/v1/external-service` |

    The base URL includes the trailing `/external-service`; the paths below sit directly under it (for example `GET {BASE_URL}/referral-codes`).

    ## Scopes

    | Scope | Covers |
    |---|---|
    | `referrals:read` | Listing codes |
    | `referrals:write` | Creating, enabling, disabling and deleting codes (includes `referrals:read`) |

    ## Code rules

    - 3–64 characters of `A-Z`, `a-z`, `0-9`, `-` and `_`.
    - **Case-insensitive.** `PARTNER-A` and `partner-a` are the same code and cannot coexist.
    - **First come, first served**, unique across all partners, because sign-up links share a single namespace.
    - **There is no rename.** To correct a code, delete it and create a new one.

    ## GET /referral-codes

    Lists all of your codes, newest first.

    - 200:
      ```json
      {
        "data": [
          { "code": "PARTNER-A", "enabled": true, "label": "Agency A",
            "link": "https://app.pay-3.io/?ref=PARTNER-A",
            "createdAt": "...", "updatedAt": "..." }
        ]
      }
      ```
    - `link` is the sign-up link carrying the code: `https://app2.pay-3.io/?ref=<code>` in sandbox, `https://app.pay-3.io/?ref=<code>` in production.
    - **No query parameters are accepted.** Any parameter returns `400` with a body such as `Unknown query parameter "enabled". Accepted: (none)`, so a filter that looks applied but is not can never be mistaken for a complete list. There is no paging and no filtering.

    ## POST /referral-codes

    - body: `{ "code": "PARTNER-A", "label": "Agency A", "enabled": true }`
      - `label` and `enabled` are optional; `enabled` defaults to `true`. `label` is a free-form note for your own use and is not shown to end users.
    - 201: the single code, in the shape above.
    - 400: invalid code format.
    - 409: the code is already taken, by you or by another partner.

    ## PATCH /referral-codes/{code}

    Enables or disables a code; `enabled` is the only mutable field.

    - body: `{ "enabled": false }`
    - 200: the updated code.
    - 400: an attempt to change anything other than `enabled` (renaming means delete, then create).
    - 404: no such code for your client.

    A disabled code stops attributing new sign-ups — `POST /users/register` returns `400` for it. **Users already attributed keep their attribution.**

    ## DELETE /referral-codes/{code}

    - 200: `{ "code": "PARTNER-A", "deleted": true }`
    - 404: no such code for your client.

    Attribution is fixed at sign-up, so deleting a code changes neither past attribution nor reporting. Deletion cannot be undone.

    Codes are matched exactly, case-insensitively. Wildcard characters carry no meaning in the path: `%` and `_` are not expanded, so bulk deletion is not possible.

    ## Attributing users

    Pass `referral_code` to `POST /users/register` to attribute the new user to that code.

    ```bash
    curl -X POST "$BASE_URL/users/register" \
      -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
      -d '{
            "signup_type": "EMAIL",
            "signup_type_id": "taro@example.com",
            "first_name": "Taro",
            "referral_code": "PARTNER-A"
          }'
    ```

    - On success the response carries `referralCode`, or `null` if no attribution was made.
    - **Only codes issued by your own client are accepted.** A code belonging to another partner returns the same `400`, with a byte-identical body, as a code that does not exist.
    - **An unknown or disabled code returns `400` and no user is created.** Ignoring it silently would leave a user who carried a code but was never attributed.
    - Attribution is **one code per user** and is never overwritten later.

    ### Sign-up links (`?ref=`)

    Users who sign up through the `link` returned by `GET /referral-codes` are attributed to that code at sign-up and reported by the `user.registered` webhook (**Webhooks**). They appear in `GET /users/list` with the same `referralCode` value.

    ---
    The machine-readable specification is [openapi.yaml](openapi.yaml). See also **Users** for reading the attributed users and their status.

    ---

    # Idempotency

    Operations that move money or provision accounts are idempotent, so a network retry cannot execute them twice.

    ## Usage

    Send an `Idempotency-Key` header. The value is a unique string you generate; a UUID is recommended.

    ```bash
    curl -X POST "$BASE_URL/card/issue_card" \
      -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
      -H "Idempotency-Key: 7c1f...-unique" \
      -d '{ "userId": "<uuid>", "type": "virtual" }'
    ```

    ## Behavior

    - Only the first request for a given `(client, Idempotency-Key, endpoint)` triple is executed, and its result is stored.
    - A retry with the same key returns **the stored first result**, without re-executing. Two cards are never issued.
    - That stored result is a replay, **not the current state**. For example, retrying `POST /pool/transfer` returns the original `{"status":"pending"}` even after the instruction has settled. This keeps "same key, same response" a firm contract. Read current state with `GET /pool/transfer/{transferId}`.
    - Reusing a key with a **different body** returns `409`. This catches a key accidentally attached to a different instruction.
    - Sending the same key while the first request is still in progress returns `409` (in progress). Wait briefly and retry.
    - If the first request failed with a server error, the key is released and can be reused.

    ## Endpoints that support it

    | Endpoint |
    |---|
    | `POST /card/issue_card` |
    | `POST /kyc/submit` |
    | `POST /pool/transfer` |

    Requests without the header still work, but sending it on these operations is strongly recommended.

    See also: **Quickstart** · [openapi.yaml](openapi.yaml)

    ---

    # Webhooks

    Events that occur in Pay3, such as card issuance, are pushed to your endpoint, so you can stay in sync without polling.

    ## Configuration

    The receiving endpoint and the signing key are managed under **Developer → Webhooks** in the partner console.

    - The receiving endpoint (HTTPS) and an optional description.
    - The events you subscribe to, chosen from **Event types**. All are selected by default, and `ping` is delivered regardless. Unsubscribed events are not delivered and do not appear in the delivery log.
    - The signing key, issued with the endpoint. It can be revealed at any time in the console, and reissuing it invalidates the previous key immediately.

    ## Delivery format

    Events are delivered as a `POST` with a JSON body to the registered URL.

    | Header | Contents |
    |---|---|
    | `X-Pay3-Event` | Event type, for example `card.issued` |
    | `X-Pay3-Delivery` | Delivery id (unchanged across retries) |
    | `X-Pay3-Signature` | Signature (see below) |

    ```json
    {
      "id": "<delivery-uuid>",
      "type": "card.issued",
      "created_at": "2026-09-15T01:50:00.000Z",
      "data": { "userId": "<uuid>", "cardId": "<uuid>", "cardType": "virtual", "issuedAt": "2026-09-15T01:50:00.000Z" }
    }
    ```

    `data` contains only the fields defined for that event type. Raw responses from the card platform or the identity verification provider are never relayed.

    ## Signature verification

    `X-Pay3-Signature` is an HMAC-SHA256 (hex) over the raw body as received, keyed with the webhook secret. Verification is required; discard any request that fails it.

    ```js
    import crypto from "node:crypto";

    function verify(rawBody, signature, secret) {
      const expected = crypto.createHmac("sha256", secret).update(rawBody).digest("hex");
      return crypto.timingSafeEqual(Buffer.from(expected), Buffer.from(signature));
    }
    ```

    ## Retries

    - A `2xx` response counts as a successful delivery.
    - `5xx`, a 10-second timeout, and connection failures are retried with exponential backoff, up to 6 times. Retries run on a 5-minute cycle, so arrival can be up to 5 minutes later than the table below.
    - `4xx` responses are not retried, because resending the same payload would not change the outcome; the delivery is marked `failed` immediately. `408`, `425`, and `429` are the exceptions and are retried.

    | Retry | 1st | 2nd | 3rd | 4th | 5th | 6th (last) |
    |---|---|---|---|---|---|---|
    | Wait since the previous failure | 30 s | 60 s | 2 min | 4 min | 8 min | 16 min |

    The wait is 30 seconds × 2^(retry − 1), capped at 1 hour. After 6 failed retries the delivery is marked `failed` — at most 7 attempts including the first. Recover anything you missed from the API (`GET /pool/ledger`, `GET /pool/transfers`, `GET /users/list`).

    Process deliveries idempotently, de-duplicating on the body's `id` (equal to `X-Pay3-Delivery`). A retry arrives with the same `id` and the same bytes. `created_at` is the time the underlying state changed, fixed at first dispatch, so it does not change on retry.

    ## Delivery status

    | State | Meaning |
    |---|---|
    | `pending` | Waiting to be delivered (first attempt, or waiting for a retry) |
    | `delivered` | A `2xx` was received |
    | `failed` | Delivery was attempted and failed, and the retry limit (6) was reached |
    | `skipped_no_endpoint` | No endpoint was registered, so delivery was never attempted |

    `skipped_no_endpoint` is not a delivery failure. Only events that occur after an endpoint is registered are delivered; earlier events are recorded this way and are never re-sent, so read them back from the API.

    ## Event types

    | Event | Emitted when | `data` fields |
    |---|---|---|
    | `user.registered` | A new user signs up through your referral link | `userId, email, name, partnerRefCode, registeredAt` |
    | `user.kyc.updated` | The result of either verification stage changes | `userId, kycStatus, stage, stageStatus, updatedAt` |
    | `card.issued` | A virtual card is issued | `userId, cardId, cardType, issuedAt` |
    | `card.activated` | A physical card is activated | `userId, cardId, cardType, activatedAt` |
    | `pool.deposit.credited` | A pool credit is applied | `referenceId, grossAmount, feeAmount, netAmount, available, currency, transactionHash, chain, sourceAddress, creditedAt` |
    | `pool.transfer.completed` | A charge is applied | `transferId, userId, amount, settledAt` |
    | `pool.transfer.failed` | A charge fails and the amount is returned | `transferId, userId, amount, reason, compensatedAt` |

    **`user.registered`** fires only for browser sign-ups carrying `?ref=`; `POST /users/register` does not emit it, because its response already returns `userId`. `partnerRefCode` is the same value that `GET /users/list` returns as `referralCode` for that user, so the two can be compared directly.

    **`user.kyc.updated`** covers two stages — first-line identity verification (`identity`) and the card issuer's own review (`card_issuer`) — and is sent whenever either changes. `stage` is the stage that changed and `stageStatus` its new status (`approved`, `rejected`, `pending`). `kycStatus` is the overall status, where `approved` means charge instructions and card issuance will pass (same rules as **Users**). When only the first stage is approved, `kycStatus` is still `pending`, so wait for the event where `kycStatus` becomes `approved`.

    ```json
    { "userId": "<uuid>", "kycStatus": "pending",  "stage": "identity",    "stageStatus": "approved", "updatedAt": "..." }
    { "userId": "<uuid>", "kycStatus": "approved", "stage": "card_issuer", "stageStatus": "approved", "updatedAt": "..." }
    ```

    **`card.activated`** applies to physical cards only, so `cardType` is always `physical`. It fires on successful activation and not on re-activation. Virtual cards are usable as soon as they are issued and emit `card.issued` only.

    **`pool.deposit.credited`** is not tied to a user, so there is no `data.userId`. `referenceId` is `<chain>:<transactionHash>`, the same value as `referenceId` on the `deposit` row in `GET /pool/ledger` (**Partner Pool**). `available` is the pool balance immediately after the credit.

    ## Test delivery and redelivery

    - **Send test** under Developer → Webhooks delivers a single `ping` event. Its arrival is visible in the delivery log on the same screen.
    - Failed deliveries are retried automatically every 5 minutes, up to the retry limit above. For a manual redelivery, contact Pay3 with the delivery `id` from the log.

    The machine-readable API reference is `openapi.yaml`.

    ---


servers:
  - url: https://api-staging.pay-3.io/functions/v1/external-service
    description: "sandbox (Development)"
  - url: https://api.pay-3.io/functions/v1/external-service
    description: "production"

tags:
  - name: Auth
    description: "Access tokens for the data plane"
  - name: Users
    description: "Register and look up your own end users"
  - name: KYC Service
    description: "Identity verification (Sumsub) and card-platform onboarding"
  - name: Card Service
    description: "Quote, issue, and manage cards"
  - name: Pool
    description: "Partner pool: balance, deposit address, top-up instructions, ledger"
  - name: Referral codes
    description: "Referral codes and sign-up links attributed to your client"

security:
  - bearerAuth: []

paths:
  /oauth/access-token:
    post:
      tags:
        - Auth
      summary: Generate OAuth access token
      operationId: createAccessToken
      security: []
      description: |
        Generates an OAuth access token for accessing the external service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clientId:
                  type: string
                  description: Opaque client ID shown in the console (`client_` + 32 hex).
                  example: "client_9f2c1b7e4d0a4c8e9b1f2a3c4d5e6f70"
                clientSecret:
                  type: string
                  description: API key (`pay3_sk_test_…` for sandbox, `pay3_sk_live_…` for production). Shown once at issuance.
                  example: "pay3_sk_test_XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: OAuth access token generated successfully
                  accessToken:
                    type: string
                    example: "eyJjbGllbn********tIiwiY2xpZW50X2FwaV9rZXkiOiJkNm9zS0tRWUczZVdUbkE4Q0djVWprWDlpaUN4bnlldUdibXBOVHR3MF9jIiwidGltZXN0YW1wIjoxNzYyNDQ3NzAwMjE3LCJ1dWlkIjoiODY3ZWY5YjctYjM1NC00OWUwLTgyNTktYzIyYjUxMTkwZDZjIn0=./V9EI/wBvkf3qZ2G*****dWQxBBKVsE4+E="
                  success:
                    type: boolean
                    example: true
        "400":
          description: |
            The request body could not be parsed as JSON
            (`{ "message": "Invalid JSON body", "code": 400 }`), or `clientId` was absent
            (`{ "message": "Client ID or name is required", "code": 400 }`). Input errors are
            never reported as `500`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: |
            The `clientId` / `clientSecret` pair is not accepted
            (`{ "message": "Invalid client credentials", "code": 401 }`).
            **"No such client name" and "wrong client secret" return the byte-identical
            response** — splitting them would turn this endpoint into a client-name
            existence oracle. Which side failed is recorded in Pay3's server-side logs only.
            Note `clientId` is the opaque client ID (`client_` + 32 hex) shown in the console; the display name still works for clients created before 2026-09-18. Passing the internal UUID also
            yields this `401`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/register:
    post:
      tags:
        - Users
      operationId: registerUser
      summary: Register a new user
      description: |
        Registers a new user with basic information such as first name, last name, and signup type.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - first_name
                - signup_type_id
                - signup_type
              properties:
                first_name:
                  type: string
                  example: Pratham1
                last_name:
                  type: string
                  example: ""
                signup_type_id:
                  type: string
                  example: "835519111"
                signup_type:
                  type: string
                  example: TELEGRAM
      responses:
        "200":
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User registered successfully
                  code:
                    type: integer
                    example: 0
                  data:
                    type: object
                    properties:
                      first_name:
                        type: string
                        example: Pratham1
                      last_name:
                        type: string
                        example: ""
                      card_issued:
                        type: boolean
                        example: false
                      userId:
                        type: string
                        example: a8b70aa0-5b6f-481d-b9d2-2617b9e4f5b7
        "400":
          description: |
            Invalid request. Returned for a body that cannot be parsed as JSON
            (`Invalid JSON body`), an unsupported `signup_type`
            (`Unsupported signup_type`), a missing or empty `signup_type_id`
            (`User data missing`), and an unknown or foreign `referral_code`
            (`referral_code is unknown or disabled`). No user is created.
            Input errors are never reported as `500`; a `500` always means a
            Pay3-side fault that is safe to retry unchanged.
            Identity matching is a **byte-for-byte** comparison of
            `signup_type_id` — Pay3 applies no normalisation, so the caller must
            send EMAIL in lower case and PHONE in E.164.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            The `signup_type_id` already belongs to a user outside the calling
            client's tenant. The body carries `message` and `code` only — no
            `userId`, no name, no card status. Re-registering an existing user of
            your own tenant is **not** an error: it returns `200` with the same
            `userId` (see docs/api/junoe-sandbox.md §4).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users:
    get:
      tags:
        - Users
      operationId: getUser
      summary: Get user by ID
      description: |
        Retrieves user information if the ID is provided.
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: The user ID (UUID)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User fetched successfully
                  code:
                    type: integer
                    example: 0
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: a8b70aa0-5b6f-481d-b9d2-2617b9e4f5b7
                      first_name:
                        type: string
                        example: Pratham1
                      last_name:
                        type: string
                        example: ""
                      email:
                        type: string
                        nullable: true
                        example: null
                      phone_number:
                        type: string
                        nullable: true
                        example: null
                      telegram_id:
                        type: string
                        example: "835519111"
                      client_id:
                        type: string
                        example: 1df64a72-72be-4522-a0ed-62a7a608e6d3
                      created_at:
                        type: string
                        format: date-time
                        example: "2025-11-06T11:24:28.575703+00:00"
                      updated_at:
                        type: string
                        nullable: true
                        example: null
                      signup_type_id:
                        type: string
                        example: "835519111"
                      signup_type:
                        type: string
                        example: TELEGRAM
                      card_issued:
                        type: boolean
                        example: false
                      kyc_verified:
                        type: boolean
                        nullable: true
                        example: null
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/list:
    get:
      tags:
        - Users
      operationId: listUsers
      summary: List partner users (spec §10-3)
      description: |
        Lists the users attributed to the calling partner: users that signed up
        through one of the partner's referral codes, plus users created via
        `POST /users/register`. This is the same set that `GET /users/{userId}`
        and `POST /pool/transfer` accept.

        `cardStatus` is a **summary flag** taken from Pay3's own records — the
        endpoint issues no per-user card lookups, so a slow or unavailable card
        platform never blocks the list. Card details (count, type, frozen state)
        come from `GET /users/{userId}`.

        The path is `/users/list` (not `GET /users`): `GET /users?id=` is a
        separate, pre-existing endpoint and is left untouched.

        Ordering is fixed: newest `registeredAt` first, ties broken by `userId`,
        so paging with `offset` neither skips nor repeats rows.

        **Unknown query parameters return `400`.** `limit` and `offset` are the
        only accepted names and they are case-sensitive; a misspelling such as
        `?userid=` is rejected rather than ignored, because a silently dropped
        filter comes back as an unfiltered `200` that looks like a valid result.
        The error body lists the accepted names.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: |
            Decimal integer between 1 and 200. Out-of-range or non-integer values
            return `400` — they are never silently clamped.
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Decimal integer, 0 or greater. Negative or non-integer values return `400`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: |
            Successful operation. An empty `data` array means the partner has no
            users yet — it is not an error.
          content:
            application/json:
              schema:
                type: object
                required: [data, paging]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [userId, registeredAt, referralCode, kycStatus, kyc, cardStatus]
                      additionalProperties: false
                      properties:
                        userId:
                          type: string
                          example: 5c3ff529-0000-4000-8000-000000000000
                        registeredAt:
                          type: string
                          nullable: true
                          description: ISO 8601 (UTC).
                          example: "2026-09-14T10:11:12.000Z"
                        referralCode:
                          type: string
                          nullable: true
                          description: Null for users created via `POST /users/register`.
                          example: JUNOE-A
                        kycStatus:
                          type: string
                          enum: [not_submitted, pending, approved, rejected]
                          description: Overall status. `approved` means a charge / card issuance will go through.
                          example: approved
                        kyc:
                          $ref: "#/components/schemas/KycStages"
                        cardStatus:
                          type: string
                          enum: [issued, not_issued]
                          example: issued
                  paging:
                    type: object
                    required: [limit, offset, total]
                    additionalProperties: false
                    properties:
                      limit:
                        type: integer
                        example: 50
                      offset:
                        type: integer
                        example: 0
                      total:
                        type: integer
                        description: Total number of attributed users, before `limit` is applied.
                        example: 1
        "400":
          description: Invalid `limit` or `offset`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient scope (`users:status` required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{userId}:
    get:
      tags:
        - Users
      operationId: getUserById
      summary: Get partner user status (spec §8)
      description: |
        Returns the KYC completion state and card issuance status of a user that
        belongs to the calling partner.

        Visibility is limited to users attributed to the caller's client
        (attribution is recorded at sign-up through a partner referral code).
        Users that are not attributed to the caller — including users that do not
        exist — return `404`. `403` is never used for this, so the existence of a
        user id is not disclosed.

        No sensitive data (card number, CVV, BIN, billing address, name, email) is
        included.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: Pay3 user id (currently a UUID). Delivered by the `user.registered` webhook.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                required: [userId, kycStatus, kyc, cards]
                additionalProperties: false
                properties:
                  userId:
                    type: string
                    example: a8b70aa0-5b6f-481d-b9d2-2617b9e4f5b7
                  kycStatus:
                    type: string
                    enum: [not_submitted, pending, approved, rejected]
                    description: Overall status. `approved` means a charge / card issuance will go through.
                    example: approved
                  kyc:
                    $ref: "#/components/schemas/KycStages"
                  cards:
                    type: array
                    description: Empty array when the user has no card.
                    items:
                      type: object
                      required: [cardType, status]
                      additionalProperties: false
                      properties:
                        cardType:
                          type: string
                          enum: [virtual, physical]
                          example: virtual
                        status:
                          type: string
                          enum: [active, issued, shipped, activated, frozen]
                          example: active
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient scope (`users:status` required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found, or not attributed to the calling client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: |
            Card issuance status could not be retrieved. Distinct from "no cards"
            — retry rather than treating it as an empty list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

